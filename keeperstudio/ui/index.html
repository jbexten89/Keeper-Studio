<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080A">
<title>Keeper Studio</title>
<link rel="stylesheet" href="/ui/app.css?v=__KS_VERSION__">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div class="edge" id="edgeTop"><button data-toggle="top" title="Toggle top bar"></button></div>
  <div class="edge" id="edgeLeft"><button data-toggle="left" title="Toggle left panel (Tab)"></button></div>
  <aside id="left" class="panel"></aside><div id="leftGrip" class="side-grip" title="Drag to resize · double-click to reset"></div>
  <main id="center">
    <div id="banners"></div>
    <div id="filterbar"></div>
    <div id="viewport">
      <div id="empty"></div>
      <div id="gridScroll" hidden><div id="gridInner"></div></div>
      <div id="loupe" hidden></div>
      <div id="compare" hidden></div>
      <div id="survey" hidden></div>
      <div id="modView" hidden></div>
    </div>
    <div id="toolbar"></div>
    <div id="modbar" hidden></div>
  </main>
  <div id="rightGrip" class="side-grip" title="Drag to resize · double-click to reset"></div><aside id="right" class="panel"></aside>
  <div class="edge" id="edgeRight"><button data-toggle="right" title="Toggle right panel (Tab)"></button></div>
  <div class="edge" id="edgeBottom"><button data-toggle="film" title="Toggle filmstrip"></button></div>
  <footer id="film"><div class="film-grip" id="filmGrip" title="Drag to resize the filmstrip"></div><label class="film-size" title="Filmstrip size"><span>Size</span><input type="range" id="filmSize" min="84" max="320" step="4"></label><div id="filmBar"></div><div id="filmScroll"><div id="filmInner"></div></div></footer>
</div>
<div id="lights"></div>
<div id="fs"><img alt=""><div id="fsInfo"></div><button class="qc-pill off" id="fsQc" title="Quick Collection (B)"></button></div>
<div id="toasts"></div>
<div id="dropzone"><div>Drop a folder to open it</div></div>
<div id="modal" class="hidden"><div class="modal-card"></div></div>
<div id="help" hidden></div>

<script>window.KS_TOKEN = '__KS_TOKEN__';</script>
<script src="/ui/js/core.js?v=__KS_VERSION__"></script>
<script src="/ui/js/crop.js?v=__KS_VERSION__"></script>
<script src="/ui/js/composite.js?v=__KS_VERSION__"></script>
<script src="/ui/js/extract.js?v=__KS_VERSION__"></script>
<script src="/ui/js/orders.js?v=__KS_VERSION__"></script>
<script src="/ui/js/retouch.js?v=__KS_VERSION__"></script>
<script src="/ui/js/boot.js?v=__KS_VERSION__"></script>
</body>
</html>
