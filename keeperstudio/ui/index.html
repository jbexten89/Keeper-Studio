  /* ---------- actions ---------- */
  // Everything that gets printed: one Pick per kid plus the team photos.
  selectPicksTeam() {
    const ids = S.photos.filter(p => { const m = getMeta(p.key); return m.flag === 1 || m.team; }).map(p => p.id);
    if (!ids.length) return toast('No Picks (P) or team photos (T) in this folder yet', 3500);
    const nTeam = S.photos.filter(p => getMeta(p.key).team).length;
    S.selected = new Set(ids); S.active = ids[0]; S.anchor = ids[0]; this.scope = 'selected';
    refreshSelection(); renderLeft();
    // You've chosen what to crop, so start checking any of them not checked yet.
    const unchecked = ids.filter(id => !this.status.has(S.byId.get(id).path)).length;
    const start = unchecked && !this.job;
    toast(`${plural(ids.length - nTeam, 'pick')} and ${plural(nTeam, 'team photo')} selected.${start ? ` Checking framing on ${plural(unchecked, 'photo')} not checked yet.` : ' Crop will check and export just these.'}`, 5000);
    if (start) this.analyze();
  },
  async setOut(path, custom) {
    this.outDir = path; this.outCustom = custom;
    if (S.root) { if (custom) DB.put('kv', 'cropout|' + S.root, path).catch(() => {}); else DB.del('kv', 'cropout|' + S.root).catch(() => {}); }
    renderRight();
  },
  async analyze() {
    const list = scopeList(this.scope); if (!list.length || this.job) return;
    const manual = {}; list.forEach(p => { if (this.manual.has(p.path)) manual[p.path] = this.manual.get(p.path); });
    let id; try { id = (await api('/api/crop/analyze', { paths: list.map(p => p.path), manual })).job; } catch (e) { return toast(esc(e.message)); }
    this.job = id; this.jobKind = 'analyze'; this.jobState = { id, total: list.length, done: 0, busy: true, message: 'Loading face detector…' };
    renderLeft();
    const batch = [];
    const fin = await pollJob(id, s => {
      this.jobState = s;
      for (const it of s.items) { const v = { status: it.status, label: it.label, reason: it.reason, src: 'check' }; this.status.set(it.path, v); batch.push([it.path, v]); if (it.plan) this.plans.set(it.path, it.plan); }
      if (S.module === 'crop') { renderLeft(); schedule(R_CELLS); this.paintJob(); }
    });
    DB.putMany('cropstatus', batch).catch(() => {});
    this.job = null; this.jobState = null; renderAll();
    if (fin.error) return toast('Framing check failed: ' + esc(fin.error));
    const c = this.counts(list);
    toast(`Checked ${plural(list.length, 'photo')} · ${c.review} need review`, 3500);
  },
  async exportPrints() {
    const list = scopeList(this.scope); if (!list.length || this.job) return;
    if (!this.outDir) return toast('Choose an output folder first');
    const manual = {}; list.forEach(p => { if (this.manual.has(p.path)) manual[p.path] = this.manual.get(p.path); });
    let id; try { id = (await api('/api/crop/export', { paths: list.map(p => p.path), out_dir: this.outDir, manual })).job; } catch (e) { return toast(esc(e.message)); }
    this.job = id; this.jobKind = 'prints'; this.result = null;
    this.jobState = { id, total: list.length, done: 0, busy: true, message: 'Loading face detector…' };
    renderLeft();
    const batch = [];
    const fin = await pollJob(id, s => {
      this.jobState = s;
      for (const it of s.items) { const v = { status: it.status, label: it.label, reason: it.reason, src: 'export' }; this.status.set(it.path, v); batch.push([it.path, v]); }
      if (S.module === 'crop') { renderLeft(); schedule(R_CELLS); this.paintJob(); }
    });
    DB.putMany('cropstatus', batch).catch(() => {});
    this.job = null; this.jobState = null;
    if (fin.error) { renderAll(); return toast('Export failed: ' + esc(fin.error)); }
    this.result = fin.result; renderAll();
    toast(`Exported prints for ${plural(fin.result.cropped, 'photo')}${fin.result.review ? ` · ${fin.result.review} need review` : ''} <button class="toast-link" onclick="reveal(${esc(JSON.stringify(fin.result.out_dir))})">Show</button>`, 6000);
  },
  showSheets() {
    const r = this.result; if (!r || !r.sheets.length) return;
    openModal(`<h3>Contact sheets</h3><div class="sheet-list">${r.sheets.map(s => `<button class="row" data-open="${esc(s)}"><span class="lbl">${esc(baseName(s))}</span><span class="cnt">Open</span></button>`).join('')}</div>
      <div class="m-actions"><button class="btn" data-close>Close</button></div>`, card => card.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openExternal(b.dataset.open); }));
  },
  async tunables() {
    if ($('#tunePanel')) return this.closeTune();
    let t; try { t = (await api('/api/crop/tunables', {})).tunables; } catch (e) { return toast(esc(e.message)); }
    const start = Object.fromEntries(t.map(x => [`${x.section}.${x.key}`, x.value]));
    const open = { full: 'Full length', knee_above: '3/4 length', knee_below: '3/4 length', preschool: 'Preschool' }[(this.active() && this.styleOf(this.active().path)) || this.batchStyle()];
    const groups = [...new Set(t.map(x => x.group))];
    const fmt = v => v == null ? '' : (+v).toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    const row = x => { const k = `${x.section}.${x.key}`, step = x.max > 1.5 ? 0.01 : 0.002;
      return `<div class="tune-row" title="${esc(x.help)}"><label>${esc(x.label)}</label><input type="range" min="${x.min}" max="${x.max}" step="${step}" value="${x.value ?? x.min}" data-tr="${k}"><input type="number" min="${x.min}" max="${x.max}" step="${step / 2}" value="${fmt(x.value)}" data-tn="${k}"></div>`; };
    const el = document.createElement('div'); el.id = 'tunePanel'; el.className = 'tune-panel';
    el.innerHTML = `<div class="tp-head"><b>Fine-tune framing</b><button class="btn sm" data-tp="close" title="Done">Done</button></div>
      <div class="tp-note">Changes apply as you go and re-check the photo on screen. Values are shares of the frame height. Hover a row for what it does.</div>
      <div class="tp-body">${groups.map(g => `<details ${g === open || g === 'Square (tight)' ? 'open' : ''}><summary>${esc(g)}</summary>${t.filter(x => x.group === g).map(row).join('')}</details>`).join('')}</div>
      <div class="tp-foot"><button class="btn sm" data-tp="revert">Undo changes</button><button class="btn sm" data-tp="config">Open config.yaml</button></div>`;
    document.body.appendChild(el);
    const pending = {};
    const send = () => { clearTimeout(this._tuneT); this._tuneT = setTimeout(async () => {
      const values = { ...pending }; for (const k in pending) delete pending[k];
      try { await api('/api/crop/tunables', { values }); } catch (e) { return toast(esc(e.message)); }
      this.saveSettings({});
    }, 350); };
    const setVal = (k, v, from) => {
      const r = $(`[data-tr="${k}"]`, el), n = $(`[data-tn="${k}"]`, el);
      if (from !== 'r') r.value = v; if (from !== 'n') n.value = fmt(v);
      pending[k] = +v; send();
    };
    el.addEventListener('input', e => { const r = e.target.closest('[data-tr]'); if (r) setVal(r.dataset.tr, r.value, 'r'); });
    el.addEventListener('change', e => { const n = e.target.closest('[data-tn]'); if (n && n.value !== '') setVal(n.dataset.tn, n.value, 'n'); });
    el.addEventListener('keydown', e => e.stopPropagation());
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-tp]'); if (!b) return;
      if (b.dataset.tp === 'close') this.closeTune();
      else if (b.dataset.tp === 'config') openExternal(this.configPath);
      else if (b.dataset.tp === 'revert') { for (const [k, v] of Object.entries(start)) if (v != null) setVal(k, v); toast('Framing values put back'); }
    });
  },
  closeTune() { const el = $('#tunePanel'); if (el) el.remove(); },
  key(e, k) {
    if (this.adjusting) {
      if (e.key === 'Escape') { this.cancelAdjust(); return true; }
      if (e.key === 'Enter') { this.applyAdjust(); return true; }
      const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (mv) { this.moveAdjust(mv[0], mv[1], e.shiftKey); return true; }
      if (['+', '=', '-', '_'].includes(e.key)) { this.resizeAdjust(e.key === '+' || e.key === '=' ? 1 : -1, e.shiftKey); return true; }
      return e.key === ' ';
    }
    if (k === 'a') { this.startAdjust(); return true; }
    if (k === 's') { this.startSquare(); return true; }
    if (e.key === '[' || e.key === '{') { this.nudge(e.shiftKey ? -1 : -0.1); return true; }
    if (e.key === ']' || e.key === '}') { this.nudge(e.shiftKey ? 1 : 0.1); return true; }
    if (k === 'c' && !e.ctrlKey && !e.metaKey) { this.toggleCompare(); return true; }
    if (k === 'o') { this.overlay = !this.overlay; this.render(); this.modbar(); return true; }
    return false;
  },
};

/* =========================================================== Composite ==== */
const Comp = {
  f: null, order: null, built: null, job: null, jobState: null, fontsOk: {},
  async load() {
    try {
      const r = await api('/api/composite/defaults', {});
      this.f = Object.assign({ students: 'quick', teachers: 'none', out_path: '' }, r.defaults, r.saved || {});
    } catch { this.f = { students: 'quick', teachers: 'none' }; }
  },
  libraryLoaded() { this.order = null; this.built = null; this.needPick = true; this.autoNote = ''; },
  save() { api('/api/composite/defaults', { settings: this.f }).catch(() => {}); },
  sources() {
    // folders below the shoot's top folder, e.g. "Students" and "Teachers"
    const dirs = folderTree().filter(([k]) => k.includes('/')).map(([k, n]) => ['dir:' + k, `▸ ${k.split('/').slice(1).join(' / ')} (${n})`]);
    return [['selected', `Selected photos (${S.selected.size})`], ['quick', `Quick Collection (${collCount(quickColl())})`],
      ...userColls().map(c => ['coll:' + c.id, `${c.name} (${collCount(c)})`]), ...dirs, ['filmstrip', `Filmstrip (${S.view.length})`]];
  },
  // a collection or folder called Students / Teachers is picked for you when a folder is opened
  autoPick() {
    const find = re => {
      const c = userColls().find(c => re.test(c.name.trim()) && collCount(c));
      if (c) return 'coll:' + c.id;
      const d = folderTree().find(([k]) => k.includes('/') && re.test(k.split('/').pop().trim()));
      return d ? 'dir:' + d[0] : null;
    };
    const st = find(/^(students?|kids|players?|athletes?)$/i), te = find(/^(teachers?|staff|coach(es)?)$/i);
    const got = [];
    if (st && this.f.students !== st) { this.f.students = st; got.push('Students'); }
    if (te && this.f.teachers !== te) { this.f.teachers = te; got.push('Teachers'); }
    if (got.length) { this.save(); this.autoNote = `${got.join(' and ')} picked from the folder or collection of that name.`; }
  },
  photosFor(src) { return this.photosFrom(src).filter(p => !Ret.isDonor(p.path)); },  // eye donors never go on a composite
  photosFrom(src) {
    if (!src || src === 'none') return [];
    if (src === 'selected') return orderedSelection().map(id => S.byId.get(id)).filter(Boolean);
    if (src === 'filmstrip') return S.view.slice();
    if (src.startsWith('dir:')) { const k = src.slice(4); return S.photos.filter(p => p.folder === k || p.folder.startsWith(k + '/')).sort((a, b) => collator.compare(a.name, b.name)); }
    const c = getColl(src === 'quick' ? QUICK : src.slice(5)); return c ? collPhotos(c) : [];
  },
  async refreshOrder() {
    if (this.needPick && this.f && S.photos.length) { this.needPick = false; this.autoPick(); }
    const st = this.photosFor(this.f.students).map(p => p.path), te = this.photosFor(this.f.teachers).map(p => p.path);
    try { this.order = await api('/api/composite/order', { students: st, teachers: te, max_per_row: +this.f.max_per_row || 8, row_counts: this.f.row_counts || '' }); } catch { this.order = null; }
    const fonts = [this.f.title_font, this.f.teacher_font, this.f.name_font, this.f.background].filter(Boolean);
    try { this.fontsOk = (await api('/api/exists', { paths: fonts })).exists; } catch {}
    if (S.module === 'composite') { renderRight(); renderLeft(); }
  },
  enter() { this.refreshOrder(); this.render(); },
  render() { renderView(); renderLeft(); renderRight(); },
  rows(n) {
    const raw = String(this.f.row_counts || '').trim();
    if (raw) return raw.split(/[\s,]+/).filter(Boolean).map(Number);
    const maxc = Math.max(1, +this.f.max_per_row || 8); if (!n) return [];
    const rows = Math.ceil(n / maxc), base = Math.floor(n / rows), extra = n % rows;
    return Array.from({ length: rows }, (_, i) => base + (i >= rows - extra ? 1 : 0));
  },
  defaultOut() {
    const st = this.photosFor(this.f.students); if (!st.length) return '';
    const name = `${this.f.school || 'Class'} ${this.f.year || ''}`.trim() + ' composite.jpg';
    return dirName(dirName(st[0].path)) + (st[0].path.includes('\\') ? '\\' : '/') + name;
  },
  fileRow(key, label, kind) {
    const v = this.f[key]; const missing = v && this.fontsOk[v] === false;
    return `<div class="frow"><span class="flabel">${label}</span><div class="pathrow"><span class="path ${missing ? 'bad' : ''}" title="${esc(v || '')}">${esc(v ? baseName(v) : 'Not set')}${missing ? ' — not found' : ''}</span><button class="btn sm" data-comp-pick="${key}" data-kind="${kind}">Choose…</button></div></div>`;
  },
  left() {
    const f = this.f || {}; const srcOpts = (val, none) => (none ? [['none', 'No teachers']] : []).concat(this.sources()).map(([v, l]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(l)}</option>`).join('');
    const html = sectionHTML('cp-class', 'Class', `<div class="form">
        <div class="frow"><span class="flabel">School name</span><input data-cf="school" value="${esc(f.school || '')}"></div>
        <div class="frow"><span class="flabel">Year</span><input data-cf="year" value="${esc(f.year || '')}" placeholder="e.g. 2026–2027"></div></div>`)
      + sectionHTML('cp-photos', 'Photos', `<div class="form">
        <div class="frow"><span class="flabel">Students</span><select data-cf="students">${srcOpts(f.students)}</select></div>
        <div class="frow"><span class="flabel">Teachers</span><select data-cf="teachers">${srcOpts(f.teachers, true)}</select></div>${this.autoNote ? `<div class="hint tight">${esc(this.autoNote)}</div>` : ''}
        ${this.fileRow('background', 'Background', 'image')}
        <div class="hint tight">Names come from the file names. Students sort by last name; number teacher files (“1 Ms Sheila”) to set their order.</div></div>`)
      + sectionHTML('cp-layout', 'Layout', `<div class="form">
        <div class="frow"><span class="flabel">Most per row</span><input type="number" min="1" max="20" data-cf="max_per_row" value="${esc(f.max_per_row ?? 8)}"></div>
        <div class="frow"><span class="flabel">Per row (optional)</span><input data-cf="row_counts" value="${esc(f.row_counts || '')}" placeholder="e.g. 6, 6, 7"></div></div>
        ${switchHTML('uppercase', !!f.uppercase, 'UPPERCASE names (Stencil look)')}`)
      + sectionHTML('cp-fonts', 'Fonts', `<div class="form">${this.fileRow('title_font', 'Title', 'font')}${this.fileRow('teacher_font', 'Teacher names', 'font')}${this.fileRow('name_font', 'Student names', 'font')}</div>`)
      + sectionHTML('cp-save', 'Save as', `<div class="form">${this.fileRow('out_path', 'File', 'save')}${!f.out_path && this.defaultOut() ? `<div class="hint tight">Default: ${esc(baseName(this.defaultOut()))}</div>` : ''}</div>`);
    const foot = this.job && this.jobState && !this.jobState.finished ? progressHTML(this.jobState, 'Building composite') : '';
    $('#left').innerHTML = `<div class="scroll">${html}</div><div class="left-foot col">${foot}<button class="btn primary big" data-comp="build" ${this.job ? 'disabled' : ''}>Build composite</button></div>`;
  },
  right() {
    const o = this.order; const R = $('#right');
    if (!o) { R.innerHTML = '<div class="scroll"><div class="hint">Choose the student photos on the left.</div></div>'; return; }
    const rows = o.rows || [];
    const person = it => `<div class="person"><img src="${thumbUrl(it.path, 200)}" alt=""><span>${esc(it.label)}</span></div>`;
    R.innerHTML = `<div class="scroll">${sectionHTML('cp-t', `Teachers · ${o.teachers.length}`, `<div class="people">${o.teachers.map(person).join('') || '<div class="hint">None</div>'}</div>`)}
      ${sectionHTML('cp-s', `Students · ${o.students.length}`, `<div class="hint tight">${rows.length ? `Rows, top to bottom: ${rows.join(' · ')}` : ''}${rows.length && rows.reduce((a, b) => a + b, 0) !== o.students.length ? ' <b class="warn">— doesn’t add up to the class size</b>' : ''}</div><div class="people">${o.students.map(person).join('') || '<div class="hint">No student photos.</div>'}</div>`)}</div>`;
  },
  center() {
    const v = $('#modView'); v.dataset.mod = 'composite';
    const src = this.built ? fileUrl(this.built.path, this.built.t) : this.f && this.f.background && this.fontsOk[this.f.background] !== false ? fileUrl(this.f.background) : null;
    v.innerHTML = `<div class="comp-stage">${src ? `<img src="${src}" alt="">` : '<div class="msg">Choose a background template and the class photos, then press Build composite.</div>'}
      ${!this.built && src ? '<div class="comp-note">Background preview — press Build composite to lay out the class</div>' : ''}</div>`;
  },
  modbar() {
    $('#modbar').innerHTML = `<button class="btn sm primary" data-comp="build" ${this.job ? 'disabled' : ''}>Build composite</button>
      ${this.built ? `<button class="btn sm" data-comp="open">Open</button><button class="btn sm" data-comp="reveal">Show in folder</button><span class="muted small">${esc(baseName(this.built.path))}</span>` : ''}<div class="tb-spacer"></div>`;
  },
  async build() {
    const f = this.f; const students = this.photosFor(f.students);
    const errs = [];
    if (!students.length) errs.push('Choose the student photos.');
    if (!f.background) errs.push('Choose a background template.');
    ['title_font', 'teacher_font', 'name_font'].forEach(k => { if (!f[k]) errs.push('Choose all three fonts.'); });
    let row_counts = null;
    if (String(f.row_counts || '').trim()) {
      row_counts = String(f.row_counts).split(/[\s,]+/).filter(Boolean).map(Number);
      if (row_counts.some(n => !(n > 0))) errs.push('“Per row” must be whole numbers, like 6, 6, 7.');
      else if (row_counts.reduce((a, b) => a + b, 0) !== students.length) errs.push(`“Per row” adds up to ${row_counts.reduce((a, b) => a + b, 0)}, but there are ${students.length} students.`);
    }
    if (errs.length) return toast(esc([...new Set(errs)][0]), 3500);
    const out = f.out_path || this.defaultOut();
    let id;
    try { id = (await api('/api/composite/build', { ...f, out_path: out, row_counts, students: students.map(p => p.path), teachers: this.photosFor(f.teachers).map(p => p.path) })).job; }
    catch (e) { return toast(esc(e.message)); }
    this.job = id; this.jobState = { id, busy: true, total: 0, done: 0, message: 'Building…' }; this.render(); this.modbar();
    const fin = await pollJob(id, s => { this.jobState = s; if (S.module === 'composite') renderLeft(); });
    this.job = null; this.jobState = null;
    if (fin.error) { this.render(); this.modbar(); return toast('Composite failed: ' + esc(fin.error), 6000); }
    this.built = { path: fin.result.out_path, t: Date.now() }; this.render(); this.modbar();
    toast(`Composite saved as “${esc(baseName(fin.result.out_path))}”`, 4000);
  },
  key() { return false; },
};

const Cut = {

    try { this.status = await api('/api/cutout/status', {}); this.ready = !!this.status.ready[this.quality]; } catch {}

    const st = this.status, m = st && st.models[this.quality], free = st && st.free_gb;
    const ask = (title, sub, buttons) => openModal(`<h3>${esc(title)}</h3><p class="muted">${sub}</p><div class="m-actions"><button class="btn" data-close>Cancel</button>${buttons}</div>`,
      card => card.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; closeModal(); if (b.dataset.go === 'fast') this.setQuality('fast'); this.run2(list, b.dataset.go === 'more'); }));

        `<button class="btn" data-go="more">Run Best anyway</button><button class="btn primary" data-go="fast">Use Fast</button>`);
    }
    this.run2(list, false);
  },
  async run2(list, checked) {
    if (list.length > 5 && !checked) {
      const [lo, hi] = this.quality === 'best' ? [15, 45] : [3, 10];
      const mins = n => n < 90 ? `${Math.round(n)} seconds` : `${Math.round(n / 60)} minutes`;
      return openModal(`<h3>Extract ${list.length} photos?</h3><p class="muted">With ${this.quality === 'best' ? 'Best' : 'Fast'} that's roughly ${mins(list.length * lo)} to ${mins(list.length * hi)}, depending on the computer. The progress card shows the time left, and Cancel stops after the current photo.${this.scope === 'all' ? '<br><br>This is the whole filmstrip. To do just some photos, select them and choose Selected.' : ''}</p>
        <div class="m-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Extract ${list.length}</button></div>`,
        card => $('[data-go]', card).addEventListener('click', () => { closeModal(); this.run2(list, true); }));
    }
    let id; try { id = (await api('/api/cutout/run', { paths: list.map(p => p.path), out_dir: this.outDir, quality: this.quality })).job; } catch (e) { return toast(esc(e.message)); }
    this.job = id; this.errors = []; this.result = null; this.jobState = { id, busy: true, total: list.length, done: 0, message: 'Getting the model ready…' }; renderLeft();
    const fin = await pollJob(id, s => {
      this.jobState = s;
      for (const it of s.items) { if (it.output) this.existing[it.path] = it.output; else this.errors.push(it); }
      this.stamp = Date.now();
      if (S.module === 'cutout') { renderLeft(); if (s.items.some(it => it.path === (S.byId.get(S.active) || {}).path)) renderView(); }
    });
    this.job = null; this.jobState = null; this.refresh();
    if (fin.error) { this.render(); return toast('Extract failed: ' + esc(fin.error), 6000); }
    this.result = fin.result; this.render();
    toast(`${plural(fin.result.ok, 'photo')} extracted <button class="toast-link" onclick="reveal(${esc(JSON.stringify(fin.result.out_dir))})">Show</button>`, 5000);
  },
  key() { return false; },
};

/* ============================================================== Orders ==== */
// Picture-day envelopes: packages, payments, photo numbers, and the lab order.
// Prices come from prices.yaml through the server; the total shown while typing
// uses the same rules (any package unlocks the lower a la carte price).
const fmt$ = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parse$ = s => { const v = parseFloat(String(s || '').replace(/[$,\s]/g, '')); return Number.isFinite(v) ? Math.max(0, Math.round(v * 100)) : 0; };
const stemOf = n => String(n || '').replace(/\.[^.]+$/, '');
const fmtDay = d => { if (!d) return ''; const t = new Date(d + 'T12:00:00'); return isNaN(t) ? d : t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
const Ord = {
  shoots: [], sid: null, d: null, cat: null, pricesPath: '', team: 'all', q: '', sort: { k: 'env', dir: 1 },
  sel: null, draft: null, view: 'orders', lab: null, crops: '', onePer: true, building: false, mer: null, merBusy: false,
  saveT: null, state: '', err: false, undo: null, last: {}, stems: null, stemsKey: '', multi: new Set(), anchor: null,
  async load() {
    await this.loadCatalog();
    try { this.shoots = (await api('/api/orders/shoots', {})).shoots; } catch { this.shoots = []; }
    const [last, one] = await Promise.all([DB.get('kv', 'orders|shoot').catch(() => null), DB.get('kv', 'orders|oneper').catch(() => null)]);
    if (one === false) this.onePer = false;
    this.sid = this.shoots.some(s => s.id === last) ? last : (this.shoots.find(s => !s.archived) || {}).id || null;
    if (this.sid) await this.refresh();
  },
  async loadCatalog() {
    try { const r = await api('/api/orders/catalog', {}); this.cat = r.catalog; this.pricesPath = r.prices_path; } catch {}
  },
  shoot() { return this.shoots.find(s => s.id === this.sid) || null; },
  products(type) { return this.cat ? this.cat.products.filter(p => p.type === type) : []; },
  prod(id) { return this.cat ? this.cat.products.find(p => p.id === id) : null; },
  async refresh() {
    if (!this.sid) { this.d = null; return; }
    try { this.d = await api('/api/orders/list', { shoot_id: this.sid }); } catch (e) { toast(esc(e.message), 5000); return; }
    const s = this.shoot(); if (s) s.n = this.d.orders.length;
    if (this.team !== 'all' && !this.d.teams.some(t => t.name === this.team)) this.team = 'all';
  },
  libraryLoaded() { this.stems = null; },
  photoFor(stem) {
    const key = `${S.gen}:${S.photos.length}`;
    if (!this.stems || this.stemsKey !== key) { this.stems = new Map(S.photos.map(p => [stemOf(p.name).toLowerCase(), p])); this.stemsKey = key; }
    return this.stems.get(stemOf(stem).toLowerCase()) || null;
  },
  // ---------- envelopes <-> filmstrip ----------
  usedStems() { return new Set((this.d ? this.d.orders : []).flatMap(o => [o.image, o.edited]).filter(Boolean).map(n => stemOf(n).toLowerCase())); },
  ordersForPhoto(p) {
    const st = stemOf(p.name).toLowerCase();
    return this.d ? this.d.orders.filter(o => [o.edited, o.image].some(n => n && stemOf(n).toLowerCase() === st)) : [];
  },
  // Put a photo in front in the filmstrip without touching the envelope.
  // Clicking a team in the left pane filters the envelopes and selects its group photo in the filmstrip.
  pickTeam(name) {
    this.team = name; renderLeft(); renderView();
    const t = name !== 'all' && this.d ? this.d.teams.find(x => x.name === name) : null;
    if (!t || !t.image || this.showPhoto(t.image)) return;
    const p = this.photoFor(t.image);
    if (p) toast(`${esc(name)}’s group photo ${esc(t.image)} is hidden by the filmstrip filter${S.filter && S.filter.flag ? ' (picks only is on)' : ''}.`, 3500);
  },
  showPhoto(stem) {
    const p = stem ? this.photoFor(stem) : null; if (!p || !S.viewIndex.has(p.id)) return false;
    S.active = p.id; S.selected = new Set([p.id]); S.anchor = p.id;
    renderFilm(); renderFilmBar(); ensureVisible(); return true;
  },
  // The photo for a new envelope: the next one in the filmstrip after the envelope
  // just finished that no envelope uses yet. With the filmstrip showing only
  // picks (one per kid, in shooting order) that is the next kid.
  nextPhoto(after) {
    if (!S.view.length) return null;
    const used = this.usedStems(), ap = after ? this.photoFor(after) : null;
    const i = ap && S.viewIndex.has(ap.id) ? S.viewIndex.get(ap.id) + 1 : (S.active != null && S.viewIndex.has(S.active) ? S.viewIndex.get(S.active) : 0);
    const free = p => !used.has(stemOf(p.name).toLowerCase()) && !getMeta(p.key).team;
    // after the last kid, wrap round to any earlier photo still without an envelope
    return S.view.slice(i).find(free) || S.view.slice(0, i).find(free) || null;
  },
  async photoClicked(id) {
    if (S.module === 'orders' && this.pickingTeam != null) return this.finishTeamPick(id);
    if (S.module !== 'orders' || this.view !== 'orders' || this.multi.size > 1) return;
    const p = S.byId.get(id); if (!p) return;
    const d = this.draft, st = stemOf(p.name);
    // An envelope still waiting for its photo (a new one, or one showing the
    // auto-picked photo) takes the clicked photo, even one another envelope
    // already uses: the same kid can have two envelopes.
    if (d && (this.autoPhoto || !(d.image || d.edited)) && !getMeta(p.key).team) {
      if (stemOf(d.image || '').toLowerCase() !== st.toLowerCase()) { d.image = st; d.edited = ''; this.changed(true); }
      return;
    }
    // Otherwise open the envelope that uses this photo; with two, each click goes to the next.
    const os = this.ordersForPhoto(p); if (!os.length) return;
    const i = os.findIndex(o => o.id === this.sel);
    const o = os[(i + 1) % os.length];
    if (o.id !== this.sel) this.select(o.id);
  },
  picksOnly() { return S.filter.flag === 'pick'; },
  setPicksOnly(on) { S.filter = { ...S.filter, flag: on ? 'pick' : 'any' }; syncFilterBar(); afterFilter(); this.modbar(); },
  // '5371' -> the photo in the open folder ending in 5371, else the folder's own prefix (IMG_5371)
  matches(digits) {
    if (!digits) return [];
    const re = new RegExp(`(^|\\D)${digits}(\\D|$)`);
    return [...new Set(S.photos.map(p => stemOf(p.name)).filter(n => re.test(n)))].sort(collator.compare).slice(0, 12);
  },
  normImage(v) {
    v = String(v || '').trim();
    if (/^\d+$/.test(v)) {
      const m = this.matches(v); if (m.length === 1) return m[0];
      const first = S.photos.length ? stemOf(S.photos[0].name) : ''; const pre = (first.match(/^\D+/) || ['IMG_'])[0];
      return pre + v;
    }
    return v.replace(/\.(jpe?g|png|tiff?|heic|hif|cr[23]|dng)$/i, '');
  },
  enter() { this.render(); if (this.view === 'lab') this.loadLab(); this.loadCatalog().then(() => { if (S.module === 'orders') renderRight(); }); },
  render() { renderView(); renderLeft(); renderRight(); this.modbar(); },
  rows() {
    if (!this.d) return [];
    let r = this.d.orders;
    if (this.team !== 'all') r = r.filter(o => (o.team || '') === this.team);
    const q = this.q.trim().toLowerCase();
    if (q) r = r.filter(o => [o.envelope, o.athlete, o.team, o.coach, o.parent, o.phone, o.image, o.edited, o.frames, o.summary.packages, o.notes].join(' ').toLowerCase().includes(q));
    const { k, dir } = this.sort;
    const val = o => k === 'env' ? (/^\d+$/.test(o.envelope) ? +o.envelope : 1e9) : k === 'total' ? o.summary.total_cents : k === 'due' ? o.summary.due_cents : k === 'lab' ? o.summary.lab_cents : k === 'profit' ? o.summary.keep_cents : k === 'ppct' ? (o.summary.total_cents ? o.summary.keep_cents / o.summary.total_cents : -1e9) : String(o[k] || '').toLowerCase();
    return r.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || collator.compare(a.athlete, b.athlete) || a.id - b.id; });
  },
  // ---------- pricing while typing (the server prices what is saved) ----------
  price(lines) {
    const live = (lines || []).filter(l => l.qty > 0 && this.prod(l.product_id));
    const hasPkg = live.some(l => this.prod(l.product_id).type === 'package');
    let total = 0, savings = 0;
    for (const l of live) { const p = this.prod(l.product_id), u = this.unit(p, hasPkg); total += u * l.qty; savings += (p.price - u) * l.qty; }
    return { hasPkg, total, savings };
  },
  unit(p, hasPkg) { return p.type === 'alacarte' && hasPkg ? p.with_package : p.price; },
  qty(pid) { const l = ((this.draft && this.draft.lines) || []).find(l => l.product_id === pid); return l ? l.qty : 0; },
  setQty(pid, q) {
    const d = this.draft; if (!d) return;
    const before = this.price(d.lines).total;
    const order = (this.cat ? this.cat.products : []).map(p => p.id);
    d.lines = d.lines.filter(l => l.product_id !== pid);
    q = clamp(q, 0, 20); if (q) d.lines.push({ product_id: pid, qty: q });
    d.lines.sort((a, b) => order.indexOf(a.product_id) - order.indexOf(b.product_id));
    // paid in full stays paid in full when the order changes
    if (d.paid_method && d.paid_cents === before) d.paid_cents = this.price(d.lines).total;
    this.changed(true);
  },
  togglePkg(letter, add) {
    const p = this.products('package').find(p => p.letter.toLowerCase() === letter.toLowerCase()); if (!p || !this.draft) return false;
    const q = this.qty(p.id); this.setQty(p.id, add ? q + 1 : q ? 0 : 1); return true;
  },
  // ---------- selecting, new, saving, deleting ----------
  async flush() { while (this.saveT || this._saving) { if (this.saveT) await this.save(); else await this._saving; } },
  async select(id) {
    await this.flush();
    const o = this.d && this.d.orders.find(o => o.id === id); if (!o) return;
    this.multi = new Set([id]); this.anchor = id; this.autoPhoto = false;
    this.sel = id; this.draft = JSON.parse(JSON.stringify(o)); this.state = ''; this.err = false;
    this.showPhoto(o.edited || o.image);
    this.paintRows(); renderRight();
    const tr = $(`#modView tr[data-oid="${id}"]`); if (tr) tr.scrollIntoView({ block: 'nearest' });
  },
  async newOrder() {
    if (!this.sid) return this.editShoot(true);
    // A new envelope with nothing typed is already open: point at it instead of starting another.
    const d0 = this.draft;
    if (this.sel === 'new' && d0 && !d0.id && !d0.athlete.trim() && !d0.lines.length) {
      if (this.view !== 'orders') this.setView('orders');
      this._flashNew = true; this.paintRows();
      setTimeout(() => { const i = $('#right [data-of="athlete"]'); if (i) i.focus(); }, 0);
      return;
    }
    const after = (this.draft && (this.draft.edited || this.draft.image)) || this.lastPhoto || '';
    await this.flush();
    if (this.view !== 'orders') this.setView('orders');
    this.multi = new Set(); this.sel = 'new'; this.state = ''; this.err = false;
    this.draft = { envelope: this.d ? this.d.next_envelope : '1', athlete: '', team: this.team !== 'all' ? this.team : (this.last.team || ''), coach: this.last.coach || '',
      lines: [], glasses: false, paid_method: '', paid_cents: 0, image: '', frames: '', edited: '', parent: '', phone: '', email: '', notes: '' };
    if (this.draft.team && !this.last.coach && this.d) { const o = this.d.orders.find(o => o.team === this.draft.team && o.coach); if (o) this.draft.coach = o.coach; }
    const next = this.nextPhoto(after); this.autoPhoto = !!next;
    if (next) { this.draft.image = stemOf(next.name); this.showPhoto(this.draft.image); }
    this._flashNew = true; this.paintRows(); renderRight();
    setTimeout(() => { const i = $('#right [data-of="athlete"]'); if (i) i.focus(); }, 0);
  },
  changed(redraw) {
    this.state = 'Saving…'; this.err = false; clearTimeout(this.saveT);
    this.saveT = setTimeout(() => this.save(), 450);
    if (redraw) renderRight(); else { this.paintTotal(); this.paintState(); }
  },
  async save() {
    clearTimeout(this.saveT); this.saveT = null;
    const d = this.draft; if (!d || !this.sid) return;
    if (!d.id && !d.athlete.trim() && !d.lines.length) { this.state = ''; this.paintState(); return; }  // nothing typed yet
    if (this._saving) { this._again = true; return this._saving; }
    const body = {}; for (const k of ['id', 'envelope', 'athlete', 'team', 'coach', 'parent', 'phone', 'email', 'glasses', 'frames', 'image', 'edited', 'notes', 'paid_method', 'paid_cents', 'lines']) if (k in d) body[k] = d[k];
    this._saving = (async () => {
      try {
        const o = (await api('/api/orders/save', { shoot_id: this.sid, order: body })).order;
        if (this.draft === d) { d.id = o.id; d.summary = o.summary; if (this.sel === 'new') this.sel = o.id; }
        this.last = { team: o.team, coach: o.coach }; if (o.edited || o.image) this.lastPhoto = o.edited || o.image;
        this.state = 'Saved'; this.err = false;
        await this.refresh();
      } catch (e) { this.state = 'Not saved: ' + e.message; this.err = true; }
    })();
    await this._saving; this._saving = null;
    if (this._again) { this._again = false; return this.save(); }
    if (S.module === 'orders') { this.paintRows(); renderLeft(); this.paintState(); }
  },
  async del() {
    const d = this.draft; if (!d) return;
    clearTimeout(this.saveT); this.saveT = null;
    if (!d.id) { this.sel = null; this.draft = null; return this.render(); }
    try { this.undo = (await api('/api/orders/delete', { id: d.id })).deleted; } catch (e) { return toast(esc(e.message)); }
    this.sel = null; this.draft = null; await this.refresh(); this.render();
    toast(`Deleted ${esc((this.undo && this.undo.athlete) || 'the envelope')} <button class="toast-link" onclick="KS_ordUndo()">Undo</button>`, 7000);
  },
  async undoDelete() {
    if (!this.undo) return;
    try { const o = (await api('/api/orders/restore', { order: this.undo })).order; this.undo = null; await this.refresh(); this.render(); this.select(o.id); }
    catch (e) { toast(esc(e.message)); }
  },
  move(dir) {
    const rows = this.rows(); if (!rows.length) return;
    const i = rows.findIndex(o => o.id === this.sel);
    const n = rows[i < 0 ? (dir > 0 ? 0 : rows.length - 1) : clamp(i + dir, 0, rows.length - 1)]; if (n) this.select(n.id);
  },
  // ---------- shoots & teams ----------
  editShoot(isNew, id) {
    const s = isNew ? { name: '', date: new Date().toISOString().slice(0, 10), season: '', notes: '' } : (this.shoots.find(x => x.id === (id || this.sid)) || {});
    openModal(`<h3>${isNew ? 'New shoot' : 'Shoot'}</h3>
      <label class="fld"><span>Name</span><input id="shName" value="${esc(s.name)}" placeholder="e.g. Montpelier Basketball" autofocus spellcheck="false"></label>
      <div style="display:flex;gap:12px"><label class="fld" style="flex:1"><span>Picture day</span><input id="shDate" type="date" value="${esc(s.date)}"></label>
      <label class="fld" style="flex:1"><span>Season</span><input id="shSeason" value="${esc(s.season)}" placeholder="Winter 2026"></label></div>
      <label class="fld"><span>Notes</span><textarea id="shNotes" rows="3">${esc(s.notes)}</textarea></label>
      <div class="m-actions">${isNew ? '' : `<button class="btn" id="shDel" style="margin-right:auto">Delete…</button><button class="btn" id="shArch">${s.archived ? 'Unarchive' : 'Archive'}</button>`}<button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${isNew ? 'Create' : 'Save'}</button></div>`, card => {
      const go = async extra => {
        const body = { ...(isNew ? {} : { id: s.id, archived: s.archived }), name: $('#shName', card).value, date: $('#shDate', card).value, season: $('#shSeason', card).value, notes: $('#shNotes', card).value, ...extra };
        try { const r = await api('/api/orders/shoot/save', { shoot: body }); this.shoots = r.shoots; closeModal(); if (isNew) await this.pickShoot(r.shoot.id); else this.render(); }
        catch (e) { toast(esc(e.message)); }

      $('[data-ok]', card).addEventListener('click', () => go({}));
      $('#shName', card).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go({}); } });
      const arch = $('#shArch', card); if (arch) arch.addEventListener('click', () => go({ archived: !s.archived }));

      if (del) del.addEventListener('click', () => { closeModal(); confirmDialog(`Delete ${s.name}?`, `This deletes the shoot and its ${plural(s.n || 0, 'envelope')}. A copy of the order book from earlier today is kept in Keeper Studio's backups folder.`, 'Delete shoot', async () => {
        try { this.shoots = (await api('/api/orders/shoot/delete', { id: s.id })).shoots; } catch (e) { return toast(esc(e.message)); }
        if (this.sid === s.id) await this.pickShoot((this.shoots.find(x => !x.archived) || {}).id || null); else this.render();
      }); });
    });
  },
  async pickShoot(id) {
    await this.flush();
    this.sid = id; this.sel = null; this.draft = null; this.team = 'all'; this.q = ''; this.lab = null; this.crops = '';
    if (id) DB.put('kv', 'orders|shoot', id).catch(() => {});
    this.d = null; await this.refresh(); this.render();
    if (this.view === 'lab') this.loadLab();
  },
  ask(title, label, value, note = '') {
    return new Promise(res => openModal(`<h3>${esc(title)}</h3><label class="fld"><span>${esc(label)}</span><input id="askIn" value="${esc(value)}" autofocus spellcheck="false"></label>${note ? `<p class="muted small">${note}</p>` : ''}
      <div class="m-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>OK</button></div>`, card => {
      const done = v => { closeModal(); res(v); };

      $('#askIn', card).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); done(e.target.value.trim()); } });

    }));
  },
  // ▣: with team photos marked T, the filmstrip switches to just those and a click sets it.
  async teamPhoto(team) {
    if (S.photos.some(p => getMeta(p.key).team)) return this.startTeamPick(team);

  },
  startTeamPick(team) {

  endTeamPick() {

  },
  async finishTeamPick(id) {
    const team = this.pickingTeam, p = S.byId.get(id); if (team == null || !p) return;

    try { await api('/api/orders/team-photo', { shoot_id: this.sid, team, image: stemOf(p.name) }); await this.refresh(); this.lab = null; this.render(); if (this.view === 'lab') this.loadLab(); toast(`${esc(team)} group photo: ${esc(stemOf(p.name))}`, 3000); }
    catch (e) { toast(esc(e.message)); }
  },
  async askTeamPhoto(team) {
    const t = (this.d.teams.find(x => x.name === team) || {}), act = S.byId.get(S.active);
    const v = await this.ask(`Group photo · ${team}`, 'Group photo file', t.image || (act ? stemOf(act.name) : ''),
      `The team shot that team 5x7s, team 8x10s and Memory Mates are printed from. Crop names it like ${esc((t.image || 'IMG_5373') + '_7x5')}.${act ? ` Filled in from the photo selected in the filmstrip.` : ''} Tip: press T on team photos in Library, and ▣ will show just those to click.`);

  async renameTeam(team) {

    catch (e) { toast(esc(e.message)); }
  },

  // What if: parts are {key, label, now, sold, lab}; a la carte has an alone part and a with-package part.
  wiParts() {

    for (const p of A.products) {
      const l = p.lab_each || 0;
      if (p.kind === 'alacarte') {
        out.push({ key: p.id, p, label: p.label, now: p.price, sold: p.sold_alone, lab: l });
        out.push({ key: p.id + ':pkg', p, label: p.label + ' (with a package)', now: p.with_package, sold: p.sold_with_pkg, lab: l });

  },
  wiPaint() {
    const A = this.an; if (!A || !$('#wiT')) return;
    const s = A.selection, one = this.anScope !== 'all' && A.team != null, d = this.wiDrop / 100;
    const parts = this.wiParts(), by = new Map(parts.map(x => [x.key, x]));
    let dS = 0, dL = 0; const be = [];
    for (const x of parts) {
      const np = this.wi[x.key]; if (np == null || np === x.now) continue;
      const keep = np > x.now ? x.sold * (1 - d) : x.sold;
      dS += keep * np - x.sold * x.now; dL -= (x.sold - keep) * x.lab;
      if (!x.sold) continue;
      const m0 = x.now - x.lab, m1 = np - x.lab;
      if (np > x.now && m1 > 0) { const f = Math.max(0, 1 - m0 / m1), lose = Math.floor(x.sold * f + 1e-9);
        be.push(`<div>${esc(x.label)} at ${fmt$(np)}: you could lose up to <b>${Math.round(100 * f)}% of its buyers</b> (${lose >= 1 ? `${lose} of ${x.sold}` : `under 1 of ${x.sold}`} here) and still make the same profit.</div>`); }
      else if (np < x.now) be.push(m1 > 0 ? `<div>${esc(x.label)} at ${fmt$(np)}: needs <b>${Math.ceil(x.sold * m0 / m1 - 1e-9)} buyers</b> instead of ${x.sold} to make the same profit.</div>` : `<div>${esc(x.label)} at ${fmt$(np)}: <b>loses money</b> on every one after lab cost.</div>`);
    }
    const inp = x => `<input class="${this.wi[x.key] != null && this.wi[x.key] !== x.now ? 'ch' : ''}" data-wi="${esc(x.key)}" value="${((this.wi[x.key] ?? x.now) / 100).toFixed(2)}" inputmode="decimal" spellcheck="false">`;
    const chg = (...xs) => { let t = 0, any = false; for (const x of xs) { const np = this.wi[x.key]; if (np == null || np === x.now || !x.sold) continue; any = true; const keep = np > x.now ? x.sold * (1 - d) : x.sold; t += keep * np - x.sold * x.now; }
      return any ? `<span class="${t > .5 ? 'an-up' : t < -.5 ? 'an-dn' : 'dim'}">${Math.abs(t) < .5 ? '$0.00' : (t > 0 ? '+' : '') + fmt$(Math.round(t))}</span>` : '<span class="dim">—</span>'; };

      const ps = A.products.filter(p => p.kind === kind); if (!ps.length) return '';
      if (kind === 'alacarte') return `<table class="an-t"><tr><th>${title}</th><th title="Price bought on its own">Alone</th><th title="Price with a package in the envelope">With pkg</th><th>Sold</th><th>Change</th></tr>${ps.map(p => { const a = by.get(p.id), b = by.get(p.id + ':pkg'); return `<tr><td>${esc(p.label)}</td><td>${inp(a)}</td><td>${inp(b)}</td><td title="${a.sold} alone · ${b.sold} with a package">${p.sold}</td><td>${chg(a, b)}</td></tr>`; }).join('')}</table>`;
      return `<table class="an-t"><tr><th>${title}</th><th>Now</th><th>New</th><th>Sold</th><th>Change</th></tr>${ps.map(p => { const x = by.get(p.id); return `<tr><td>${esc(p.label)}</td><td>${fmt$(x.now)}</td><td>${inp(x)}</td><td>${x.sold}</td><td>${chg(x)}</td></tr>`; }).join('')}</table>`;

        } else if (drag.kind === 'sx') { const p0 = loc({ x: drag.x, y: drag.y }), p1 = loc(pt); a.sx = clamp(a0.sx * p1.x / (p0.x || 1e-6), 0.3, 3); }
        else if (drag.kind === 'sy') { const p0 = loc({ x: drag.x, y: drag.y }), p1 = loc(pt); a.sy = clamp(a0.sy * p1.y / (p0.y || 1e-6), 0.3, 3); }
        s.dirty = true; this.draw(); this.showAdj(); return;
      }
      this.cursor = pt;
      if (last) {  // stamps along the stroke, close enough to look continuous
        const d = Math.hypot(pt.x - last.x, pt.y - last.y), step = Math.max(1, this.brush.size * 0.12);
        for (let t = step; t <= d; t += step) this.stamp(last.x + (pt.x - last.x) * t / d, last.y + (pt.y - last.y) * t / d);
        if (d >= step) last = pt;
      }
      this.draw();
    });
    const end = () => { last = null; drag = null; if (pan) { pan = null; this.panning = false; this.draw(); } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', () => { this.cursor = null; this.draw(); });
    cv.addEventListener('wheel', e => {
      if (!this.s || !this.s.tImg) return; e.preventDefault();
      const r = cv.getBoundingClientRect();
      this.zoomView(Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top);
      this.cursor = this.toRegion(e); this.draw();
    }, { passive: false });
    // Space held = hand tool
    window.addEventListener('keyup', e => { if (e.key === ' ' && this.space) { this.space = false; this.draw(); } });
  },
  setSoft(v) { this.brush.soft = clamp(Math.round(v), 0, 100); this.draw(); const r = $('[data-rt-soft]'); if (r) r.value = this.brush.soft; const b = $('#rtSoftVal'); if (b) b.textContent = this.brush.soft + '%'; },
  setSize(v) { this.brush.size = clamp(Math.round(v), 4, 600); this.draw(); const r = $('[data-rt-size]'); if (r) r.value = this.brush.size; const b = $('#rtSizeVal'); if (b) b.textContent = this.brush.size + ' px'; },
  autoMask() {
    const s = this.s; if (!s || !s.tImg) return; this.pushUndo();
    const m = s.mask.getContext('2d'); const [rx, ry] = s.lensR;
    m.save(); m.filter = `blur(${Math.max(1, s.ed * 0.04)}px)`; m.fillStyle = '#fff';
    for (const [x, y] of s.eyes) { m.beginPath(); m.ellipse(x, y, rx * 0.9, ry * 0.9, 0, 0, Math.PI * 2); m.fill(); }
    m.restore(); s.step = 'brush'; s.dirty = true; this.render();
  },
  clearMask() { const s = this.s; if (!s || !s.tImg) return; this.pushUndo(); s.mask.getContext('2d').clearRect(0, 0, s.w, s.h); s.dirty = true; this.draw(); },
  nudge(dx, dy, big) { const s = this.s; if (!s) return; const f = big ? 10 : 1; s.adj.dx += dx * f; s.adj.dy += dy * f; s.dirty = true; this.draw(); this.showAdj(); },
  zoom(dir, big) { const s = this.s; if (!s) return; const f = 1 + dir * (big ? 0.02 : 0.004); s.adj.sx = clamp(s.adj.sx * f, 0.3, 3); s.adj.sy = clamp(s.adj.sy * f, 0.3, 3); s.dirty = true; this.draw(); this.showAdj(); },
  stretch(axis, dir, big) { const s = this.s; if (!s) return; const f = 1 + dir * (big ? 0.02 : 0.004); s.adj[axis] = clamp(s.adj[axis] * f, 0.3, 3); s.dirty = true; this.draw(); this.showAdj(); },
  setAdj(k, v) { const s = this.s; if (!s || !isFinite(v)) return; if (k === 'sx' || k === 'sy') v = clamp(v / 100, 0.3, 3); s.adj[k] = v; s.dirty = true; this.draw(); },
  // update the numbers in the panel without rebuilding it (keeps typing focus)
  showAdj() {
    const a = this.s && this.s.adj; if (!a) return;
    const set = (k, v) => { const i = $(`[data-rt-adj="${k}"]`); if (i && document.activeElement !== i) i.value = v; };
    set('sx', (a.sx * 100).toFixed(1)); set('sy', (a.sy * 100).toFixed(1)); set('r', a.r.toFixed(2));
    const m = $('#rtMoved'); if (m) m.textContent = `${Math.round(a.dx)}, ${Math.round(a.dy)} px`;
  },
  turn(dir, big) { const s = this.s; if (!s) return; s.adj.r = Math.round((s.adj.r + dir * (big ? 1 : 0.25)) * 100) / 100; s.dirty = true; this.draw(); this.showAdj(); },
  resetAlign() { const s = this.s; if (!s) return; s.adj = { dx: 0, dy: 0, sx: 1, sy: 1, r: 0 }; s.dirty = true; this.draw(); this.showAdj(); },
  setStep(st) { const s = this.s; if (!s || !s.tImg) return; s.step = st; this.render(); },
  async save() {
    const s = this.s, p = this.active(); if (!s || !s.tImg || this.busy || !p) return;
    if (s.step === 'align') return this.setStep('brush');
    // anything painted at all?
    const d = s.mask.getContext('2d').getImageData(0, 0, s.w, s.h).data; let any = false;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 8) { any = true; break; }
    if (!any) return toast('Brush the eyes in first (or press M to paint them for you)');
    this.busy = true; this.right();
    try {
      await api('/api/retouch/save', { path: p.path, id: s.id, adjust: s.adj, mask: s.mask.toDataURL('image/png'), match: this.match });
      s.dirty = false;
      await this.loadInfo();
      Crop.plans.delete(p.path); Crop.status.delete(p.path);
      p.thumbState = 0; Thumbs.request(p);
      toast(`Retouched — ${esc(p.name)} now uses the clear eyes everywhere`, 3500);
    } catch (e) { toast('Couldn’t save: ' + esc(e.message), 6000); }
    this.busy = false; renderAll();
  },
  showFile() { const e = this.info.edits[(this.active() || {}).path]; if (e) reveal(e.file); },
  async saveCopy() {
    const p = this.active(), e = p && this.info.edits[p.path]; if (!e) return;
    const stem = p.name.replace(/\.[^.]+$/, '');
    const dest = await pickPath('save', { initial: S.root || '', filename: `${stem}_retouched.jpg` }); if (!dest) return;
    try { const r = await api('/api/retouch/copy', { path: p.path, dest }); toast(`Saved ${esc(baseName(r.saved))} <button class="toast-link" onclick="reveal(${esc(JSON.stringify(r.saved))})">Show</button>`, 5000); }
    catch (err) { toast('Couldn’t save the copy: ' + esc(err.message), 6000); }
  },
  async remove() {
    const p = this.active(); if (!p || !this.isEdited(p.path)) return;
    try { await api('/api/retouch/remove', { path: p.path }); } catch (e) { return toast(esc(e.message)); }
    this.work.delete(p.path); await this.loadInfo(); Crop.plans.delete(p.path); Crop.status.delete(p.path);
    p.thumbState = 0; Thumbs.request(p); toast('Retouch removed — back to the original photo'); this.open(p);
    renderAll();
  },

  /* ---------- panels ---------- */
  left() {
    const L = $('#left');
    const mine = S.photos.filter(p => this.isEdited(p.path)), donors = S.photos.filter(p => this.isDonor(p.path));
    const row = (p, tag) => `<div class="row rt-row" data-rt-go="${p.id}"><span class="style-tag inline">${tag}</span><span class="lbl">${esc(p.name)}</span></div>`;
    let html = sectionHTML('rt-how', 'Eye swap', `<div class="pad hint tight">For glasses glare: take the eyes from the frame shot without glasses.<br>
      <b>1 Line up</b> — it’s already lined up from the face; drag or use the arrow keys if it’s off.<br>
      <b>2 Brush in</b> — paint over the lenses to reveal the clear eyes.<br>
      <b>Enter</b> saves a retouched copy (the camera file is never changed). Crop, Composite and Extract use it automatically.</div>`);
    html += sectionHTML('rt-done', `Retouched in this folder (${mine.length})`, mine.length ? `<div class="style-rows">${mine.map(p => row(p, 'Fixed')).join('')}</div>` : '<div class="hint">None yet.</div>');
    html += sectionHTML('rt-don', `Eye donors (${donors.length})`, donors.length ? `<div class="hint tight">Frames the eyes came from. They’re left out of prints, composites and extracts.</div><div class="style-rows">${donors.map(p => row(p, 'Donor')).join('')}</div>` : '<div class="hint">None yet.</div>');
    L.innerHTML = `<div class="scroll">${html}</div>`;
  },
  right() {
    const R = $('#right'), p = this.active(), s = this.s;
    if (!p) { R.innerHTML = '<div class="scroll"><div class="hint">Select a photo with glasses glare.</div></div>'; return; }
    const edited = this.isEdited(p.path);
    const dn = s && s.donor ? S.byPath.get(s.donor) : null;
    let html = sectionHTML('rt-status', 'This photo', `<div class="status-card ${edited ? 'ok' : 'none'}"><div class="sc-head"><span class="st-dot ${edited ? 'ok' : 'none'}"></span><b>${edited ? 'Retouched' : this.isDonor(p.path) ? 'Eye donor' : 'Not retouched'}</b></div>
      <div class="sc-label">${edited ? 'Previews and exports use the retouched copy.' : this.isDonor(p.path) ? 'Its eyes were used for another photo; it’s left out of prints.' : 'Line up and brush in the clear eyes, then press Enter.'}</div>
      ${edited ? '<div class="btn-row"><button class="btn sm" data-rt="show" title="Open its folder in File Explorer">Show file</button><button class="btn sm" data-rt="copy" title="Save a copy of the retouched JPG somewhere else">Save a copy as…</button><button class="btn sm" data-rt="remove">Remove retouch</button></div>' : ''}</div>`);
    html += sectionHTML('rt-donor', 'Frame without glasses', dn ? `<div class="rt-donor"><img src="${thumbUrl(dn.path)}" alt=""><div><b>${esc(dn.name)}</b><div class="btn-row"><button class="btn sm" data-rt="donor-prev" title="Use the previous photo">◀</button><button class="btn sm" data-rt="donor-next" title="Use the next photo">▶</button></div></div></div>
      ${s && s.tImg && !s.found ? '<div class="miss-note">The face wasn’t found in one of the frames, so line them up by hand: drag the overlay, arrow keys to nudge, + − to resize, , . to turn.</div>' : ''}` : '<div class="hint">—</div>');
    if (s && s.tImg) {
      const a = s.adj;
      html += sectionHTML('rt-steps', 'Steps', `<div class="pad">${segHTML('rtStep', s.step, [['align', '1 Line up'], ['brush', '2 Brush in']])}</div>
        ${s.step === 'align' ? `<div class="hint tight">Line the eyes up like Free Transform: drag inside to <b>move</b>, a <b>corner</b> to resize (Shift: free), a <b>side</b> handle to stretch width or height, just <b>outside a corner</b> to rotate (Shift: 15° steps).</div>
          <div class="rt-adj"><label>Width<input type="number" step="0.1" data-rt-adj="sx" value="${(a.sx * 100).toFixed(1)}"><i>%</i></label><label>Height<input type="number" step="0.1" data-rt-adj="sy" value="${(a.sy * 100).toFixed(1)}"><i>%</i></label><label>Angle<input type="number" step="0.05" data-rt-adj="r" value="${a.r.toFixed(2)}"><i>°</i></label></div>
          <div class="hint tight">Moved <span id="rtMoved">${Math.round(a.dx)}, ${Math.round(a.dy)} px</span> · keys: arrows move · <kbd>Alt</kbd>+arrows stretch · <kbd>+</kbd> <kbd>−</kbd> size · <kbd>,</kbd> <kbd>.</kbd> rotate · Shift = bigger steps</div>
          <div class="slider-row" title="How see-through the no-glasses frame is while lining up"><span>Overlay</span><input type="range" min="15" max="85" value="${this.opacity}" data-rt-op><b id="rtOpVal">${this.opacity}%</b></div>
          <div class="btn-row pad-x"><button class="btn sm" data-rt="reset">Reset alignment</button><button class="btn sm primary" data-rt="to-brush">Looks good <kbd>Enter</kbd></button></div>`
        : `<div class="slider-row"><span>Brush</span><input type="range" min="4" max="${Math.max(60, Math.round(s.ed))}" value="${this.brush.size}" data-rt-size><b id="rtSizeVal">${this.brush.size} px</b></div>
          <div class="slider-row" title="How gradually the brush fades at its edge. Shift+[ softer, Shift+] harder"><span>Softness</span><input type="range" min="0" max="100" value="${this.brush.soft}" data-rt-soft><b id="rtSoftVal">${this.brush.soft}%</b></div>
          <div class="pad">${segHTML('rtMode', this.brush.erase ? 'erase' : 'reveal', [['reveal', 'Reveal'], ['erase', 'Erase <kbd>X</kbd>']])}</div>
          <div class="btn-row pad-x"><button class="btn sm" data-rt="auto">Paint eyes for me <kbd>M</kbd></button><button class="btn sm" data-rt="clear">Clear</button><button class="btn sm" data-rt="undo">Undo</button></div>
          <div class="hint tight"><kbd>[</kbd> <kbd>]</kbd> brush size · <kbd>Shift</kbd>+<kbd>[</kbd> <kbd>]</kbd> softness · mouse wheel or <kbd>+</kbd> <kbd>−</kbd> zoom · hold <kbd>Space</kbd> and drag to move around · <kbd>0</kbd> fit · <kbd>\\</kbd> before/after</div>`}`);
      html += sectionHTML('rt-opts', 'Options', `${switchHTML('rtMatch', this.match, 'Match brightness and colour', 'Evens out small exposure and colour differences between the two frames')}`);
      html += `<div class="pad"><button class="btn primary wide" data-rt="save" ${this.busy ? 'disabled' : ''}>${this.busy ? 'Saving…' : s.step === 'align' ? 'Next: brush in  ⏎' : (edited ? 'Save changes  ⏎' : 'Save retouch  ⏎')}</button></div>`;
    }
    R.innerHTML = `<div class="scroll">${html}</div>`;
  },
  modbar() {
    const s = this.s, mb = $('#modbar'); if (!mb || S.module !== 'retouch') return;
    const zpct = this._L ? Math.round(this._L.k * 100) : 100;
    mb.innerHTML = `<button class="toggle ${this.showBefore ? 'on' : ''}" data-rt="before" title="Before / after (\\)">Before / after <kbd>\\</kbd></button>
      <span class="rt-zoom"><button class="btn sm" data-rt="zoom-out" title="Zoom out">−</button><b>${zpct}%</b><button class="btn sm" data-rt="zoom-in" title="Zoom in (mouse wheel)">+</button><button class="btn sm" data-rt="fit" title="Fit (0)">Fit</button><button class="btn sm" data-rt="px" title="Actual pixels (1)">1:1</button></span>
      <span class="hint-keys">${!s || !s.tImg ? '' : s.step === 'align' ? 'drag inside to move · corners resize · sides stretch · outside a corner rotates · Alt+arrows stretch · wheel zoom · Enter next' : 'wheel or + − zoom · Space-drag pan · [ ] brush · Shift+[ ] softness · X erase · M paint eyes · Ctrl+Z undo · Enter save'}</span>`;
  },
  key(e, k) {
    const s = this.s, ready = s && s.tImg;
    if (e.ctrlKey || e.metaKey) { if (k === 'z' && ready) { this.undoMask(); return true; } return false; }
    if (e.key === '\\') { this.showBefore = !this.showBefore; this.draw(); this.modbar(); return true; }
    if (!ready) return false;
    if (e.key === ' ') { if (!this.space) { this.space = true; this.draw(); } return true; }
    if (e.key === '0') { this.fitView(); return true; }
    if (e.key === '1') { this.actualPixels(); return true; }
    if (e.key === 'Enter') { this.save(); return true; }
    if (s.step === 'align') {
      const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (mv && e.altKey) { if (mv[0]) this.stretch('sx', mv[0], e.shiftKey); else this.stretch('sy', -mv[1], e.shiftKey); return true; }  // Alt+← → narrower/wider, Alt+↑ ↓ taller/shorter
      if (mv) { this.nudge(mv[0], mv[1], e.shiftKey); return true; }
      if (e.key === '+' || e.key === '=') { this.zoom(1, e.shiftKey); return true; }
      if (e.key === '-' || e.key === '_') { this.zoom(-1, e.shiftKey); return true; }
      if (e.key === ',' || e.key === '<') { this.turn(-1, e.shiftKey); return true; }
      if (e.key === '.' || e.key === '>') { this.turn(1, e.shiftKey); return true; }
      if (k === 'm') { this.autoMask(); return true; }
      return false;
    }
    if (e.key === '+' || e.key === '=') { this.zoomView(1.25); return true; }
    if (e.key === '-' || e.key === '_') { this.zoomView(0.8); return true; }
    if (e.key === '{' || (e.key === '[' && e.shiftKey)) { this.setSoft(this.brush.soft + 10); return true; }
    if (e.key === '}' || (e.key === ']' && e.shiftKey)) { this.setSoft(this.brush.soft - 10); return true; }
    if (e.key === '[') { this.setSize(this.brush.size / 1.15); return true; }
    if (e.key === ']') { this.setSize(this.brush.size * 1.15); return true; }
    if (k === 'x') { this.brush.erase = !this.brush.erase; this.right(); this.draw(); return true; }
    if (k === 'm') { this.autoMask(); return true; }
    if (k === 'a') { this.setStep('align'); return true; }
    return false;
  },
};
function retouchTag(p) {
  return Ret.isEdited(p.path) ? '<span class="rt-tag" title="Retouched (eye swap)">Fixed</span>' : Ret.isDonor(p.path) ? '<span class="rt-tag donor" title="Eye donor — left out of prints">Donor</span>' : '';
}

/* ================= Boot ================= */
async function init() {
  buildFilterBar(); buildToolbar(); buildLoupe(); buildCompare(); buildHelp();
  bindEvents(); bindModuleEvents();
  renderAll();
  window.reveal = reveal;
  if (location.search.includes('fallback')) S.banners.push({ id: 'fallback', text: 'Keeper Studio opened in your web browser because its own window couldn’t start. Everything works here, but folder pickers ask you to type or paste the path.' });
  try { const h = await api('/api/hello', {}); S.recent = h.recent || []; S.hello = h; } catch (e) { toast('Keeper Studio’s engine is not responding: ' + esc(e.message), 6000); }
  { const hv = $('#help .help-ver'); if (hv && S.hello) hv.textContent = 'Keeper Studio ' + S.hello.version; }
  setTimeout(checkForUpdate, 4000);
  await Promise.all([loadStore(), Crop.load(), Comp.load(), Ord.load()]);
  renderAll();
}
init();

// Small hook for automated testing / power users
window.KeeperStudio = { loadFolder, state: S, Crop, Comp, Cut, Ret, Ord };
})();
</script>
</body>
</html>
