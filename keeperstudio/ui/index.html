:root{
  --bg:#07080A;--panel:#111317;--panel-2:#13161A;--raised:#1A1D22;--border:#22262D;--border-2:#2C313A;
  --text:#D9DCE2;--muted:#8B919B;--dim:#5A606A;--faint:#2A2F37;
  --accent:#2E9BFF;--glow:rgba(46,155,255,.45);--accent-bg:rgba(46,155,255,.12);
  --amber:#E3A04F;--reject:#D2574F;
  --l-red:#E5484D;--l-yellow:#E8C547;--l-green:#46A758;--l-blue:#4E6BE8;
  --lw:240px;--rw:280px;--th:44px;--fh:124px;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 13px/1.35 'Nunito Sans',Avenir,'Avenir Next','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--text);background:#0C0D10;border:1px solid var(--border-2);border-radius:4px;padding:4px 7px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);margin:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#262A31;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#343A43;background-clip:padding-box;border:2px solid transparent}

/* ---------- Shell layout ---------- */
#app{display:grid;height:100vh;padding-bottom:8px;
  grid-template-columns:12px var(--lw) minmax(0,1fr) var(--rw) 12px;
  grid-template-rows:var(--th) 12px minmax(0,1fr) 12px var(--fh);
  grid-template-areas:"top top top top top" "et et et et et" "el left center right er" "eb eb eb eb eb" "film film film film film"}
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;overflow:hidden;background:var(--panel-2);border-bottom:1px solid var(--border)}
#edgeTop{grid-area:et}#edgeLeft{grid-area:el}#edgeRight{grid-area:er}#edgeBottom{grid-area:eb}
#left{grid-area:left}
#leftGrip{grid-area:left;justify-self:end;width:8px;margin-right:-10px;z-index:6;cursor:ew-resize;border-radius:3px}
#leftGrip:hover,#leftGrip.drag{background:rgba(46,155,255,.45)}
#app.no-left #leftGrip{display:none}
#rightGrip{grid-area:right;justify-self:start;width:8px;margin-left:-10px;z-index:6;cursor:ew-resize;border-radius:3px}
#rightGrip:hover,#rightGrip.drag{background:rgba(46,155,255,.45)}
#app.no-right #rightGrip{display:none}#right{grid-area:right}#center{grid-area:center}#film{grid-area:film;margin:0 12px}
.edge{display:flex;align-items:center;justify-content:center}
.edge button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:10px;line-height:1;padding:2px 8px;border-radius:3px}
.edge button:hover{color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
#app.no-left #left,#app.no-right #right,#app.no-top #top,#app.no-film #film{display:none}

/* ---------- Top bar ---------- */
.logo{font-size:17px;font-weight:300;letter-spacing:.02em;white-space:nowrap}
.logo b{font-weight:700;color:var(--accent)}
.modules{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--dim);white-space:nowrap}
.modules span{padding:0 4px}
.modules .on{color:var(--text);font-weight:600}
.modules .off{opacity:.45;cursor:not-allowed}
.modules .bar{color:var(--faint);padding:0}
.top-actions{display:flex;gap:6px;margin-left:18px}

/* ---------- Buttons ---------- */
.btn{background:var(--raised);border:1px solid var(--border-2);color:var(--text);border-radius:4px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3B424D;background:#1E2228}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#03111E;font-weight:700}
.btn.primary:hover{background:#4AA9FF}
.btn.danger{background:var(--reject);border-color:var(--reject);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.lg{padding:10px 22px;font-size:14px;min-width:230px}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{background:var(--raised);border:1px solid var(--border-2);border-radius:4px;padding:4px 7px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:28px;height:26px}
.icon-btn:hover{color:var(--text);border-color:#3B424D}
.icon-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.icon-btn svg{display:block}

/* ---------- Side panels ---------- */
.scroll{flex:1;overflow:auto;min-height:0}
.sec>header{display:flex;align-items:center;gap:6px;padding:7px 10px;font-variant:all-small-caps;letter-spacing:.08em;font-size:14px;color:var(--muted);cursor:pointer;background:var(--panel-2);border-bottom:1px solid var(--border);border-top:1px solid #0C0D10}
.sec>header:hover{color:var(--text)}
.sec.closed>.body{display:none}
.tri{font-size:9px;display:inline-block;width:10px;transition:transform .15s}
.sec.closed .tri{transform:rotate(-90deg)}
.hdr-btn{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);border-radius:4px;cursor:pointer;font-size:15px;line-height:1;padding:0 6px}
.hdr-btn:hover{color:var(--accent);border-color:var(--border-2)}
.row{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-left:2px solid transparent;min-height:27px}
.row:hover{background:#181B20}
.row.on{background:#1A2330;border-left-color:var(--accent)}
.row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .cnt{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row .ico{color:var(--dim);font-size:11px;width:12px;text-align:center;flex:none}
.row.on .ico{color:var(--accent)}
.row-acts{display:none;gap:2px}
.row:hover .row-acts{display:flex}
.row-acts button{background:none;border:0;color:var(--dim);cursor:pointer;padding:0 4px;font-size:12px}
.row-acts button:hover{color:var(--text)}
.row.drop-hover{background:var(--accent-bg);outline:1px dashed var(--accent);outline-offset:-2px}
.plus{color:var(--muted)}
.hint{padding:9px 12px;color:var(--dim);font-size:12px;line-height:1.45}
.left-foot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--panel-2)}
.left-foot .btn{flex:1}

/* ---------- Center ---------- */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden}
#banners .banner{display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600}
.banner.amber{background:var(--amber);color:#1A1206}
.banner button{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0 4px}
#filterbar{display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--panel-2);flex-wrap:wrap}
.fb-title{font-variant:all-small-caps;letter-spacing:.08em;font-size:14px;color:var(--muted)}
#filterbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
#filterbar select{padding:3px 6px}
#fText{width:170px;padding:3px 8px}
.fb-count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#viewport{position:relative;flex:1;min-height:0;background:#0B0C0F}
#toolbar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid var(--border);background:var(--panel-2);overflow-x:auto;overflow-y:hidden;min-height:40px}
.tb-group{display:flex;gap:3px;align-items:center}
.tb-sep{width:1px;height:20px;background:var(--border-2);flex:none}
.tb-lbl{color:var(--muted);font-size:12px}
.tb-spacer{flex:1}
#tbInfo{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
#tbThumbWrap{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
#tbThumb{width:90px}
.tb-stars i{font-style:normal;cursor:pointer;color:#3A3F48;font-size:15px;padding:0 1px}
.tb-stars i:hover{color:var(--text)}
.tb-stars i.on{color:#D5D9E0}
.toggle{background:none;border:1px solid var(--border-2);border-radius:12px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}

/* ---------- Empty ---------- */
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.empty-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:440px;padding:20px}
.logo-big{font-size:38px;font-weight:300;letter-spacing:.02em}
.logo-big b{color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty-card p{margin:2px 0}

/* ---------- Grid ---------- */
#gridScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
#gridInner{position:relative;min-height:100%}
.cell{position:absolute;left:0;top:0;padding:4px}
.cell-in{position:relative;height:100%;background:#15181D;border:1px solid #1D2127;border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
.cell:hover .cell-in{background:#191C22}
.cell.sel .cell-in{background:#1C2635;box-shadow:inset 0 0 0 2px rgba(46,155,255,.6)}
#gridInner .cell.sel:not(.active) .cell-in::after{top:6px;right:24px}
.cell.active .cell-in{background:#28303B;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px var(--glow)}
.lbl-red{--lc:var(--l-red)}.lbl-yellow{--lc:var(--l-yellow)}.lbl-green{--lc:var(--l-green)}.lbl-blue{--lc:var(--l-blue)}
.cell.has-lbl .cell-in{border-color:var(--lc);box-shadow:inset 0 0 0 1px var(--lc)}
.cell.active.has-lbl .cell-in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px var(--glow),inset 0 0 0 2px var(--lc)}
.num{position:absolute;left:8px;top:4px;font-size:20px;font-weight:600;color:#2B3038;line-height:1;pointer-events:none;font-variant-numeric:tabular-nums}
.cell.sel .num{color:#3A414C}
.qc{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:50%;border:1.5px solid transparent;background:none;padding:0;cursor:pointer}
.cell:hover .qc{border-color:#5A616C}
.qc.on,.cell:hover .qc.on{background:#C9CED6;border-color:#C9CED6}
.cell-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 10px 2px}
.cell-img img{max-width:100%;max-height:100%;display:block;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.ph{width:62%;height:52%;border-radius:2px;background:linear-gradient(90deg,#1A1D22,#23272E,#1A1D22);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.cell.rejected .cell-img img,.fcell.rejected img,.sv.rejected img{opacity:.3}
.cell-foot{height:24px;display:flex;align-items:center;gap:7px;padding:0 8px 2px}
.flag{display:inline-flex;align-items:center;color:var(--dim);cursor:pointer;background:none;border:0;padding:0;opacity:0}
.cell:hover .flag,.sv:hover .flag,.flag.pick,.flag.rej{opacity:1}
.flag.pick{color:var(--accent)}
.flag.rej{color:var(--reject)}
.stars{display:inline-flex;font-size:11px}
.stars i{font-style:normal;color:#2E333B;cursor:pointer;padding:0 1px}
.stars i.on{color:#D5D9E0}
.stars.zero{opacity:0}
.cell:hover .stars.zero,.sv:hover .stars.zero{opacity:1}
.ext{margin-left:auto;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}

/* ---------- Loupe / Compare / Survey ---------- */
#loupe,#survey{position:absolute;inset:0;overflow:hidden}
.zv{position:absolute;inset:0;overflow:hidden;cursor:zoom-in;touch-action:none}
.zv.zoomed{cursor:grab}
.zv.grabbing{cursor:grabbing}
.zv img{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 4px 24px rgba(0,0,0,.6);max-width:none}
img:not([src]){visibility:hidden}
.loupe-info{position:absolute;left:14px;top:10px;font-size:12px;color:var(--muted);pointer-events:none;text-shadow:0 1px 3px #000;line-height:1.55}
.loupe-info b{color:var(--text);font-weight:600;font-size:14px}
.zoom-badge{position:absolute;right:12px;top:10px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.55);border:1px solid var(--border-2);padding:2px 8px;border-radius:10px;pointer-events:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:20px}
#compare{position:absolute;inset:0;display:flex;gap:6px;padding:6px}
.cmp-pane{flex:1;position:relative;border:1px solid var(--border);border-radius:4px;background:#0A0B0D;display:flex;flex-direction:column;min-width:0}
.cmp-pane.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 16px var(--glow)}
.cmp-stage{position:relative;flex:1;min-height:0}
.cmp-foot{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--border);font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden}
.cmp-tag{font-variant:all-small-caps;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.cmp-pane.on .cmp-tag{color:var(--accent)}
.cmp-foot .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cmp-foot .flag{opacity:1}
.sv{position:absolute;padding:4px}
.sv-in{height:100%;position:relative;border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;cursor:pointer}
.sv:hover .sv-in{border-color:var(--border-2)}
.sv.active .sv-in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px var(--glow)}
.sv.has-lbl .sv-in{box-shadow:inset 0 0 0 2px var(--lc)}
.sv.active.has-lbl .sv-in{box-shadow:0 0 0 1px var(--accent),0 0 14px var(--glow),inset 0 0 0 2px var(--lc)}
.sv-img{flex:1;min-height:0;position:relative;margin:6px;overflow:hidden;border-radius:2px}
.sv .zv img{box-shadow:0 2px 10px rgba(0,0,0,.6)}
.sv-foot{height:26px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px}
.sv-x{position:absolute;right:7px;top:7px;opacity:0;background:rgba(0,0,0,.65);border:1px solid var(--border-2);border-radius:50%;width:22px;height:22px;cursor:pointer;color:var(--text);font-size:11px;padding:0}
.sv:hover .sv-x{opacity:1}
.sv-x:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Quick Collection marker on large photos ---------- */
.qc-pill{position:absolute;z-index:4;display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:16px;background:#E6E9EE;color:#07080A;font-size:12px;font-weight:700;letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.65);cursor:pointer;border:0;white-space:nowrap}
.qc-pill::before{content:'';width:9px;height:9px;border-radius:50%;background:#07080A}
.qc-pill.off{display:none;background:rgba(10,11,14,.72);color:var(--text);box-shadow:none;outline:1px solid var(--border-2);font-weight:600}
.qc-pill.off::before{background:none;box-shadow:inset 0 0 0 1.5px var(--text)}
.sv:hover .qc-pill.off,#loupe:hover .qc-pill.off,.cmp-stage:hover .qc-pill.off{display:inline-flex}
.qc-ring{outline:4px solid #E6E9EE;outline-offset:-4px}
.sv .qc-pill{top:12px;left:12px}
#loupe .qc-pill{top:10px;right:64px}
.cmp-stage .qc-pill{top:10px;left:10px}
#fs .qc-pill{top:16px;right:16px;font-size:14px;padding:7px 15px 7px 12px}

/* ---------- Filmstrip ---------- */
#film{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
#film{position:relative}
.film-grip{position:absolute;left:0;right:0;top:0;height:5px;cursor:ns-resize;z-index:5}
.film-grip:hover,.film-grip.drag{background:rgba(46,155,255,.45)}
.film-size{position:absolute;right:10px;top:3px;z-index:4;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.film-size input{width:110px;height:14px}
#filmBar{padding-right:170px !important;height:24px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;background:var(--panel-2)}
#filmBar b{color:var(--text);font-weight:600}
#filmBar .sep{color:var(--faint)}
#filmScroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;min-height:0}
#filmInner{position:relative;height:100%}
.fcell{position:absolute;top:0;height:100%;padding:5px 3px}
.fcell-in{height:100%;background:#15181D;border:1px solid #1D2127;border-radius:3px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding-bottom:10px}
.fcell.sel .fcell-in{background:#1A2636;box-shadow:inset 0 0 0 2px rgba(46,155,255,.75)}
.fcell.sel .fcell-in::after,.cell.sel:not(.active) .cell-in::after{content:'✓';position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#03111E;font-size:11px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.fcell.active .fcell-in::after{width:18px;height:18px;line-height:18px}
#app.multi .fcell:not(.sel) img{opacity:.35;filter:grayscale(.5)}
#app.multi .fcell:not(.sel):hover img{opacity:.8;filter:none}
.fcell.has-lbl .fcell-in{border-color:var(--lc)}
.fcell.active .fcell-in{border-color:var(--accent);background:#1E2D42;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 1px var(--accent),0 0 12px var(--glow)}
.fcell img{max-width:calc(100% - 8px);max-height:calc(100% - 4px);display:block}
.fbadges{position:absolute;left:4px;right:4px;bottom:1px;display:flex;gap:4px;align-items:center;font-size:9px;height:11px}
.fbadges .flag{opacity:1}
.fbadges .stars{font-size:8px}
.tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:12px;height:12px;padding:0 2px;border-radius:2px;background:#C9CED6;color:#07080A;font-size:9px;font-weight:700;line-height:1}
.fbadges .qcdot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#C9CED6}

/* ---------- Right panel ---------- */
.hist-wrap{padding:10px}
#hist{width:100%;height:auto;display:block;border-radius:4px;border:1px solid var(--border)}
.hist-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:7px 2px 0;font-variant-numeric:tabular-nums}
.info-tbl{padding:8px 12px 10px;display:grid;grid-template-columns:84px 1fr;gap:5px 10px;font-size:12px}
.info-tbl .k{color:var(--muted);text-align:right}
.info-tbl .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.st-row{display:flex;align-items:center;gap:8px}
.st-row .k{width:52px;color:var(--muted);font-size:12px;text-align:right}
.big-stars i{font-style:normal;font-size:17px;color:#3A3F48;cursor:pointer;padding:0 1px}
.big-stars i.on{color:#D5D9E0}
.big-stars i:hover{color:var(--text)}
.swatch{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.12);cursor:pointer;background:var(--lc);opacity:.45;padding:0}
.swatch:hover{opacity:.8}
.swatch.on{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--text)}
.chips{padding:10px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;border:1px solid var(--border-2);font-size:12px;cursor:pointer;margin:0 5px 6px 0;background:none;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.sel-note{padding:8px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border)}

/* ---------- Overlays ---------- */
#lights{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .25s}
body.lights1 #lights{opacity:.75;pointer-events:auto}
body.lights2 #lights{opacity:1;pointer-events:auto}
body.lights1 #viewport,body.lights2 #viewport{z-index:41}
body.lights2 #viewport{background:#000}
#fs{position:fixed;inset:0;background:#000;z-index:60;display:none;align-items:center;justify-content:center}
#fs.on{display:flex}
#fs img{max-width:100vw;max-height:100vh;object-fit:contain}
#fsInfo{position:absolute;left:16px;bottom:12px;color:var(--muted);font-size:12px;text-shadow:0 1px 3px #000;display:flex;gap:10px;align-items:center}
#fsInfo .flag{opacity:1}
#toasts{position:fixed;left:50%;bottom:calc(var(--fh) + 48px);transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast{background:rgba(22,25,30,.96);border:1px solid var(--border-2);padding:7px 15px;border-radius:18px;margin-top:6px;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:nowrap}
.toast.in{opacity:1;transform:none}
#dropzone{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:12px;background:rgba(7,8,10,.85);z-index:95;display:none;align-items:center;justify-content:center;font-size:20px;color:var(--accent)}
#dropzone.on{display:flex}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:center;justify-content:center}
#modal.hidden{display:none}
.modal-card{background:var(--panel);border:1px solid var(--border-2);border-radius:10px;padding:20px 22px;width:min(540px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:text}
.modal-card h3{margin:0 0 16px;font-weight:700;font-size:16px}
.modal-card.report{width:min(1500px,96vw);max-height:92vh;display:flex;flex-direction:column}
.rep-head{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin:0 0 12px}.rep-head h3{margin:0 0 2px}
.rep-paper{background:#fff;color:#1b1e24;border-radius:4px;padding:14px 16px;overflow:auto;flex:1;min-height:120px}
table.rep{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.rep th{position:sticky;top:-14px;background:#E6E8EC;border-bottom:1.5px solid #555B66;text-align:left;padding:5px 6px;font-weight:600;white-space:nowrap}
table.rep td{padding:4px 6px;border-bottom:1px solid #E1E4E9;vertical-align:top}
table.rep tbody tr:nth-child(even):not(.grp):not(.tot) td{background:#FAFAFB}
table.rep .r{text-align:right}table.rep .c{text-align:center}
table.rep tr.grp td{background:#F1F3F6;font-weight:700;border-top:1px solid #9AA0AA;padding-top:7px}
h4.rep-h{margin:18px 0 6px;font-size:14px;font-weight:600;color:#1b1e24}h4.rep-h:first-child{margin-top:0}
table.rep tr.tot td{font-weight:700;border-top:1.5px solid #000;background:#E6E8EC}
.fld{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}
.fld>span{font-variant:all-small-caps;letter-spacing:.08em;font-size:14px;color:var(--muted)}
.radio,.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.radio em{font-style:normal;color:var(--muted)}
.radio select{margin-left:4px}
.sub{display:flex;align-items:center;gap:8px;padding-left:24px;color:var(--muted);flex-wrap:wrap}
.sub input[type=number]{width:84px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.rules label{color:var(--muted);font-size:12px;text-align:right}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-card .banner{border-radius:5px;margin:0 0 14px;font-size:12px}
.prog{height:8px;background:#0B0C0F;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.prog .bar{height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--glow);transition:width .15s}
.prog-txt{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#help{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:flex;align-items:center;justify-content:center}
.help-card{background:var(--panel);border:1px solid var(--border-2);border-radius:10px;padding:20px 24px;width:min(860px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.help-card h3{margin:0 0 14px;font-weight:700}
.help-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 28px}
.help-grid h4{margin:12px 0 4px;font-variant:all-small-caps;letter-spacing:.08em;color:var(--accent);font-weight:600;font-size:14px}
.hk{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #181B20;font-size:12px}
.hk span:first-child{color:var(--muted)}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;background:#0C0D10;font:600 11px/1.5 inherit;text-align:center;color:var(--text);margin-left:3px}

/* ---------- Keeper Studio: modules ---------- */
.logo-sub{font-weight:300;color:var(--muted);margin-left:7px;letter-spacing:.04em}
.logo-big .logo-sub{font-size:.7em}
.modules button{background:none;border:0;color:var(--dim);font:inherit;font-size:15px;cursor:pointer;padding:2px 6px;border-radius:4px}
.modules button:hover{color:var(--text)}
.modules button.occ{font-size:13px;opacity:.75}.modules button.occ:hover,.modules button.occ.on{opacity:1}
.modules .mod-div{display:inline-block;width:1px;height:18px;padding:0;background:var(--border-strong, #3a3f47);margin:0 10px 0 12px}
.modules button.on{color:var(--text);font-weight:600}
#modView{position:absolute;inset:0;overflow:hidden}
#modbar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-top:1px solid var(--border);background:var(--panel-2);min-height:40px;overflow:hidden;white-space:nowrap}
body:not([data-module="library"]) #toolbar,body:not([data-module="library"]) #filterbar{display:none!important}
.pad{padding:10px 12px}
.hint.tight{padding:6px 12px 2px}
.btn.wide{width:100%}
.btn.big{width:100%;padding:10px 12px;font-size:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);margin-top:6px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.left-foot.col{flex-direction:column;align-items:stretch}
kbd{font-size:10px}
.toast{pointer-events:auto}
.toast-link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;margin-left:8px;padding:0}
/* segmented control & switch */
.seg{display:flex;background:#0C0D10;border:1px solid var(--border-2);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:5px 8px;border-radius:4px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;cursor:pointer}
.sw-row>span{color:var(--text)}
.switch{position:relative;width:34px;height:19px;border-radius:12px;border:1px solid var(--border-2);background:#0C0D10;cursor:pointer;padding:0;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.switch.on{background:var(--accent-bg);border-color:var(--accent)}
.switch.on i{transform:translateX(15px);background:var(--accent)}
.disabled{opacity:.4;pointer-events:none}
.slider-row{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;color:var(--muted);font-size:12px}
.slider-row input{flex:1}
.slider-row b{font-weight:600;color:var(--text);min-width:40px;text-align:right}
.pathrow{display:flex;align-items:center;gap:6px;min-width:0}
.path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0C0D10;border:1px solid var(--border-2);border-radius:4px;padding:5px 8px;font-size:12px;direction:rtl;text-align:left}
.path.bad{border-color:var(--reject);color:#F0A39E}
.modal-card .pathrow .path{direction:ltr}
/* status */
.st-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.st-dot.ok{background:#3CC77F}.st-dot.short{background:var(--amber)}.st-dot.manual{background:var(--accent)}.st-dot.review{background:var(--reject)}.st-dot.none{background:#3A3F48}
.status-card{margin:10px 12px;padding:10px 12px;border-radius:8px;background:#0E1013;border:1px solid var(--border)}
.status-card.ok{border-color:rgba(60,199,127,.45)}.status-card.short{border-color:rgba(227,160,79,.55)}.status-card.manual{border-color:rgba(46,155,255,.5)}.status-card.review{border-color:rgba(210,87,79,.6)}
.sc-head{display:flex;align-items:center;gap:8px;font-size:14px}
.sc-head b{font-weight:600}
.sc-label{color:#F0A39E;margin-top:4px}
.status-card details{margin-top:6px}
.status-card summary{cursor:pointer;color:var(--muted);font-size:12px}
.status-card pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--muted);margin:6px 0 0;user-select:text}
.spin-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.res-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin:8px 0 2px;font-size:13px}
/* sizes */
.sizes{padding:6px 0}
.size-row{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:default}
.size-row:hover,.size-row.hot{background:#181C22}
.size-row.off .sz-name,.size-row.off .sz-dim{color:var(--dim)}
.size-row.off .swatch-line{opacity:.25}
.chk{width:15px;height:15px;border-radius:3px;border:1px solid var(--border-2);background:#0C0D10;cursor:pointer;padding:0;flex:none;position:relative}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #03111E;border-width:0 2px 2px 0;transform:rotate(45deg)}
.swatch-line{width:14px;height:10px;border:2px solid var(--c);border-radius:2px;flex:none}
.sz-name{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.sz-name em{white-space:nowrap;font-style:normal;font-size:10px;color:var(--muted);border:1px solid var(--border-2);border-radius:8px;padding:0 5px;margin-left:4px}
.sz-dim{flex:none;margin-left:8px;white-space:nowrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sz-group{padding:8px 12px 2px;font-variant:all-small-caps;letter-spacing:.08em;color:var(--muted)}
.row .st-dot{margin-right:2px}
/* job cards */
.job-card{background:#0E1013;border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.job-card.done{border-color:var(--border-2)}
.job-top{display:flex;justify-content:space-between;align-items:baseline}
.job-top b{font-weight:600}
.job-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-card .btn.sm{align-self:flex-start}
.prog.busy .bar{width:30%!important;animation:busy 1.1s ease-in-out infinite}
@keyframes busy{0%{margin-left:-30%}100%{margin-left:100%}}
/* crop stage */
.crop-stage{position:absolute;inset:0;overflow:hidden;background:#0A0B0D}
.crop-canvas{position:absolute}
.crop-canvas img{position:absolute;inset:0;width:100%;height:100%;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.crop-canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#cropLabels{position:absolute;inset:0;pointer-events:none}
.box-tag{position:absolute;transform:translate(0,-100%);background:var(--c);color:#06080A;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.crop-hud{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:12px;background:linear-gradient(#0A0B0D,rgba(10,11,13,.6));z-index:3}
.hud-left,.hud-right{display:flex;align-items:center;gap:12px;min-width:0}
.hud-name{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-msg{color:var(--muted)}
.st-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap}
.st-pill.ok{background:#3CC77F;color:#04150B}.st-pill.short{background:var(--amber);color:#1A1206}.st-pill.manual{background:var(--accent);color:#03111E}
.st-pill.review{background:var(--reject);color:#fff}.st-pill.none{background:#22262D;color:var(--muted)}
.crop-spin{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(17,19,23,.95);border:1px solid var(--border-2);border-radius:18px;padding:7px 14px;display:flex;align-items:center;gap:8px;color:var(--muted);z-index:3}
.crop-job{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:min(440px,80%);background:rgba(17,19,23,.96);border:1px solid var(--border-2);border-radius:10px;padding:10px 14px;z-index:4;display:flex;flex-direction:column;gap:7px}
.crop-job .cj-top{display:flex;align-items:center;gap:10px}.crop-job .cj-top span{color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.crop-job .cj-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crop-spin span{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
#cropAdj{position:absolute;inset:0}
.adj-box{position:absolute;box-shadow:0 0 0 9999px rgba(5,6,8,.66);outline:2px solid var(--accent);cursor:move;touch-action:none}
.crop-stage{clip-path:inset(0)}
.adj-box i{position:absolute;width:16px;height:16px;background:var(--accent);border:2px solid #06080A;border-radius:3px}
.adj-box i[data-h=nw]{left:-9px;top:-9px;cursor:nwse-resize}.adj-box i[data-h=ne]{right:-9px;top:-9px;cursor:nesw-resize}
.adj-box i[data-h=sw]{left:-9px;bottom:-9px;cursor:nesw-resize}.adj-box i[data-h=se]{right:-9px;bottom:-9px;cursor:nwse-resize}
.adj-third{position:absolute;background:rgba(255,255,255,.28);pointer-events:none}
.adj-third.v1,.adj-third.v2{top:0;bottom:0;width:1px}.adj-third.v1{left:33.33%}.adj-third.v2{left:66.66%}
.adj-third.h1,.adj-third.h2{left:0;right:0;height:1px}.adj-third.h1{top:33.33%}.adj-third.h2{top:66.66%}
.adj-tag{position:absolute;left:0;top:-24px;background:var(--accent);color:#03111E;font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap}
/* filmstrip / grid crop badges */
.fcell .crop-dot,.cell .crop-dot{position:absolute;top:5px;left:5px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px rgba(7,8,10,.85);z-index:2}
.cell .crop-dot{top:9px;left:auto;right:26px}
.crop-dot.ok{background:#3CC77F}.crop-dot.short{background:var(--amber)}.crop-dot.manual{background:var(--accent)}.crop-dot.review{background:var(--reject)}
/* composite */
.form{padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-direction:column;gap:4px}
.flabel{font-size:12px;color:var(--muted)}
.form input,.form select{width:100%}
.comp-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:#0A0B0D}
.comp-stage img{max-width:100%;max-height:100%;box-shadow:0 8px 40px rgba(0,0,0,.65)}
.comp-note{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(17,19,23,.92);border:1px solid var(--border-2);border-radius:16px;padding:6px 14px;color:var(--muted);font-size:12px}
.people .hint{grid-column:1/-1}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;padding:8px 12px 12px}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;text-align:center;color:var(--muted)}
.person img{width:64px;height:80px;object-fit:cover;border-radius:4px;background:#1A1D22}
.person span{line-height:1.2;color:var(--text)}
.warn{color:var(--amber);font-weight:600}
/* cut-out */
.cut-stage{position:absolute;inset:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:56px 28px 28px}
.cut-stage img{max-width:100%;max-height:100%;box-shadow:0 6px 30px rgba(0,0,0,.5)}
.cut-stage.checker{background-color:#15171B;background-image:conic-gradient(#20242A 25%,transparent 0 50%,#20242A 0 75%,transparent 0);background-size:22px 22px}
.cut-stage.checker img{box-shadow:none}
.cut-hud{position:absolute;top:8px;left:12px;right:12px;display:flex;align-items:center;gap:14px}
.cut-hud .seg{width:220px}
.model-line{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px}.model-line.warn{color:var(--amber)}.st-dot.warn{background:var(--amber)}
/* empty / recent */
.recent{width:100%;max-width:440px;margin-top:6px;text-align:left}
.recent h4{margin:10px 0 6px;font-variant:all-small-caps;letter-spacing:.08em;color:var(--muted);font-weight:600}
.recent button{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:1px solid transparent;border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--text);text-align:left}
.recent button:hover{background:#15181D;border-color:var(--border-2)}
.recent small{color:var(--dim);font-size:11px;direction:rtl;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tune-grid{display:grid;grid-template-columns:1fr 110px;gap:8px 14px;align-items:center;margin:8px 0}
.tune-grid label{color:var(--text)}
.sheet-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto}
.sheet-list .row{background:none;border:0;color:var(--text);text-align:left;width:100%}
.prompt-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:center;justify-content:center}
.filter-empty{position:absolute;inset:0;min-height:300px}
.filter-empty>div{display:flex;flex-direction:column;align-items:center;gap:10px;line-height:1.5}
.filter-empty .btn{margin-top:6px}
.filter-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 12px 0;padding:8px 10px;border-radius:6px;background:var(--amber);color:#1A1206;font-size:12px}
.filter-note b{font-weight:700}
.filter-note .btn{margin-left:auto;background:#1A1206;border-color:#1A1206;color:#fff}
.crop-canvas.rotating{overflow:hidden}
#cropImg{transition:transform .06s linear;transform-origin:50% 50%}
.crop-canvas.rotating svg,.crop-canvas.rotating #cropLabels{opacity:0}
#cropGrid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.32) 1px,transparent 1px);background-size:12.5% 12.5%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.straight{display:flex;align-items:center;gap:10px;padding:10px 12px 2px}
.straight input{flex:1}
.straight b{font-weight:600;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.pad-x{padding:0 12px}
.circle-tg{margin-left:6px;white-space:nowrap;line-height:16px;background:none;border:1px solid var(--border-2);border-radius:10px;color:var(--muted);font:inherit;font-size:11px;padding:0 7px;cursor:pointer}
.circle-tg:hover{color:var(--text)}
.circle-tg.on{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}
.sz-name{display:flex;align-items:center;white-space:nowrap;min-width:0}
.miss-note{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--amber);color:#1A1206;font-size:12px;line-height:1.45}
.miss-note b{font-weight:700}
.miss-note kbd{color:var(--text)}
.crop-canvas.cmp img{position:absolute;inset:0;width:100%;height:100%;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.cmp-tag{position:absolute;left:0;bottom:-24px;font-size:12px;color:var(--muted);white-space:nowrap}
.cmp-tag i{font-style:normal;color:var(--amber)}
.straight.compact{display:flex;align-items:center;gap:6px;padding:8px 12px}
.straight.compact input{flex:1;min-width:0}
.straight.compact .btn.icon{width:24px;padding:0;justify-content:center;flex:none}
.straight.compact b{min-width:42px;text-align:right;font-weight:600}
.straight.compact b.resettable{cursor:pointer;color:var(--accent)}
.sec-note{margin-left:auto;color:var(--dim);font-size:12px;cursor:help}
.sizes{padding:3px 0}
.size-row{padding:3px 12px}
#left .sec .row{padding-top:3px;padding-bottom:3px}
#left .sec .pad{padding-top:6px;padding-bottom:6px}
#left .slider-row{gap:8px;padding-right:14px}#left .slider-row b{min-width:0}
.rechecking{position:relative}
.rechecking .status-card{opacity:.45;pointer-events:none}
.recheck-badge{position:absolute;top:18px;right:22px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status-card.checking{min-height:96px}
.size-row.master{border-bottom:1px solid var(--border);margin-bottom:3px;padding-bottom:6px}
.size-row.master .sz-name{font-weight:600}
.chk.some{background:#0C0D10;border-color:var(--accent)}
.chk.some::after{content:'';position:absolute;left:3px;top:6px;width:7px;height:2px;background:var(--accent)}
.job-time{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.style-row{display:flex;align-items:center;gap:8px;margin:0 12px 10px;font-size:12px;color:var(--muted)}
.style-row select{flex:1;min-width:0;background:#0E1013;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
.style-row select.own{border-color:var(--accent);color:var(--accent)}
.style-row em{font-style:normal;color:var(--accent);white-space:nowrap}
.own-note{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;padding:6px 8px;border-radius:6px;background:rgba(46,155,255,.1);color:var(--accent);font-size:12px}
.tune-panel{position:fixed;left:12px;top:56px;bottom:150px;width:300px;z-index:60;display:flex;flex-direction:column;background:#111317;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.tp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)}
.tp-note{padding:8px 12px;font-size:11.5px;color:var(--muted);line-height:1.4}
.tp-body{flex:1;overflow:auto;padding:0 6px 8px}
.tp-body details{border-top:1px solid var(--border)}
.tp-body summary{cursor:pointer;padding:8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tune-row{display:grid;grid-template-columns:1fr 62px;gap:2px 8px;align-items:center;padding:3px 6px 6px}
.tune-row label{grid-column:1/3;font-size:12px}
.tune-row input[type=number]{width:62px;background:#0E1013;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:2px 4px;font:inherit;font-size:12px}
.tp-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.style-tag{position:absolute;bottom:5px;left:5px;z-index:2;padding:0 5px;border-radius:4px;background:rgba(7,8,10,.85);border:1px solid var(--accent);color:var(--accent);font-size:10.5px;font-weight:700;line-height:15px;pointer-events:auto}
.cell .style-tag{bottom:auto;top:30px;left:8px}
.style-tag.inline{position:static;display:inline-block;flex:none;min-width:26px;text-align:center}
.style-tag.inline.none{border-color:var(--border);color:var(--dim)}
.style-rows{margin:0 -12px 8px}
.style-rows .row{display:flex;align-items:center;gap:8px;padding:3px 12px;cursor:pointer;font-size:12.5px}
.style-rows .row:hover{background:rgba(255,255,255,.04)}
.style-rows .row.on{background:rgba(46,155,255,.14)}
.style-rows .row .lbl{flex:1}
.style-rows .row .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.size-sub{display:flex;align-items:center;gap:8px;padding:0 12px 4px 38px;font-size:12px;color:var(--muted)}
.size-sub .sub-elbow{width:10px;height:10px;border-left:1px solid var(--border-2);border-bottom:1px solid var(--border-2);margin-top:-8px;flex:none}
.size-sub .sub-lbl{flex:1}
.mini-switch{position:relative;width:28px;height:16px;flex:none;border-radius:8px;border:none;background:#2A2E36;cursor:pointer;padding:0}
.mini-switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#C9CED6;transition:left .12s}
.mini-switch.on{background:var(--accent)}
.mini-switch.on::after{left:14px;background:#fff}
.banner.info{background:var(--accent);color:#03111E}
.banner.info button[data-dismiss]{color:#03111E}
.banner .banner-act{margin-left:auto;background:#03111E;color:#fff;border-color:#03111E}
.help-ver{margin-left:10px;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
/* Framing card keeps one height, so the size list below never moves while stepping through photos */
#right .sec[data-sec=c-status]:not(.closed) > .body{height:198px;overflow-y:auto;scrollbar-width:thin}
/* ---------- Orders ---------- */
#modView[data-mod=orders]{display:flex;flex-direction:column;overflow:hidden}
.ord-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.ord-head input[type=search]{width:240px}
.ord-head .ttl{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord-scroll{flex:1;overflow:auto;min-height:0}
.otbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.otbl th{position:sticky;top:0;z-index:1;background:var(--panel);color:var(--muted);font-weight:400;font-variant:all-small-caps;letter-spacing:.06em;font-size:13px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
.otbl th:hover{color:var(--text)}
.otbl tfoot td{position:sticky;bottom:0;z-index:1;background:var(--panel);border-top:1px solid var(--border-2);padding:7px 10px;font-weight:600;white-space:nowrap}
.otbl tfoot td.dim{font-weight:400}
.otbl th.amt,.otbl td.amt{text-align:right}
.otbl th .arr{color:var(--accent);margin-left:3px}
.otbl td{padding:6px 10px;border-bottom:1px solid #16191D;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.otbl tbody tr{cursor:pointer;user-select:none}
.otbl tbody tr:hover{background:#14171B}
.otbl tbody tr.sel{background:#1A2330;box-shadow:inset 2px 0 0 var(--accent)}
.otbl .dim{color:var(--dim)}
.otbl .due{color:var(--amber)}
.otbl .ok{color:#3CC77F}
.otbl .warn{color:var(--amber)}
.otbl .env{color:var(--muted);width:1%}
.ord-empty{padding:60px 20px;text-align:center;color:var(--dim)}
.ord-empty h3{color:var(--text);font-weight:600;margin:0 0 8px}
.of-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;padding:10px 12px}
.of-grid .fld{margin:0}
.of-grid .wide{grid-column:1/-1}
/* Envelope # is short; Team gets the room. Athlete and Coach share the next line. */
.of-grid.who{grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}.of-grid.who>.fld>span{white-space:nowrap}
.of-grid.who>.fld:nth-child(1){grid-column:span 3}.of-grid.who>.fld:nth-child(2){grid-column:span 9}
.of-grid.who>.fld:nth-child(3),.of-grid.who>.fld:nth-child(4){grid-column:span 6}
/* Orders editor, compact so Packages through Payment fit with the Total pinned below */
.ord-ed .sec>header{padding:4px 10px;font-size:13px}
.ord-ed .of-grid.who{gap:7px 10px;padding:6px 12px 8px}
.ord-ed .of-grid.who .fld{gap:3px}.ord-ed .of-grid.who .fld>span{font-size:12.5px}
.ord-ed .of-grid.who input{height:26px;padding-top:0;padding-bottom:0}
.ord-ed .pkgs{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:8px 12px 3px}
.ord-ed .pkg{padding:4px 0 3px}.ord-ed .pkg b{font-size:15px}
.ord-ed .pkg-note{padding:2px 12px 6px}
.ord-ed .qrow{min-height:24px;padding:2px 12px}
.ord-ed .stepper button{height:20px;width:22px}
.ord-ed .pay-row{padding:6px 12px 2px}.ord-ed .sec[data-sec=o-pay] .body{padding-bottom:6px}
.ord-total.pinned{flex:none;display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:10px;row-gap:2px;padding:8px 12px;border-bottom:0}
.ord-total.pinned .st{font-size:12px}.ord-total.pinned .sub{grid-column:1/-1;margin:0;text-align:left}
.ord-total.pinned .labline{display:inline;margin:0;padding:0}

    case 'unflagged': if (m.flag !== 0) return false; break;
    case 'rejected': if (m.flag !== -1) return false; break;
    case 'notrejected': if (m.flag === -1) return false; break;
  }
  if (r.team && !m.team) return false;
  if (r.rating && m.rating < r.rating) return false;
  if (r.label && r.label !== 'any') { if (r.label === 'none' ? !!m.label : m.label !== r.label) return false; }
  if (r.text && !p.name.toLowerCase().includes(r.text.toLowerCase())) return false;

/* ---------- Survey ---------- */
const svEls = new Map();

  for (let cols = 1; cols <= n; cols++) {

async function getHist(p) {
  if (p.hist) return p.hist;
  const img = new Image(); img.src = p.thumbUrl; await img.decode();
  const w = Math.min(220, img.naturalWidth), h = Math.max(1, Math.round(img.naturalHeight * w / img.naturalWidth));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  const r = new Uint32Array(256), g = new Uint32Array(256), b = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) { r[d[i]]++; g[d[i + 1]]++; b[d[i + 2]]++; }
  return (p.hist = { r, g, b });
}
function drawHist(cv, hist) {
  if (!cv) return; const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#0B0C0F'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1C2026'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(i * W / 4 + .5, 0); ctx.lineTo(i * W / 4 + .5, H); ctx.stroke(); }
  if (!hist) return;
  let max = 1; for (const a of [hist.r, hist.g, hist.b]) for (let i = 2; i < 254; i++) if (a[i] > max) max = a[i];
  ctx.globalCompositeOperation = 'lighter';
  [[hist.r, 'rgba(225,72,72,.7)'], [hist.g, 'rgba(70,195,95,.7)'], [hist.b, 'rgba(46,120,255,.8)']].forEach(([a, col]) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i < 256; i++) ctx.lineTo(i / 255 * W, H - Math.sqrt(Math.min(1, a[i] / max)) * H * .94);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

function onKey(e) {
  const caps = !!(e.getModifierState && e.getModifierState('CapsLock'));
  if (caps !== S.caps) { S.caps = caps; syncToolbar(); }
  const t = e.target; const tag = t.tagName;
  const typing = (tag === 'INPUT' && !['range', 'checkbox', 'radio'].includes(t.type)) || tag === 'TEXTAREA' || tag === 'SELECT';
  if (modalOpen()) {
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'Enter' && tag !== 'TEXTAREA' && tag !== 'SELECT') { const ok = $('.modal-card [data-ok]'); if (ok && !ok.hidden && !ok.disabled) { e.preventDefault(); ok.click(); } }
    return;
  }
  if (typing) { if (e.key === 'Escape' || e.key === 'Enter') t.blur(); return; }
  const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
  if (mod && e.shiftKey && k === 'e') { e.preventDefault(); return openExport(); }
  if (mod && k === 'z') { e.preventDefault(); return undo(); }
  if (mod && k === 'a') { e.preventDefault(); return S.module === 'orders' ? Ord.selectAllRows() : selectAll(); }
  if (mod && k === 'd') { e.preventDefault(); return S.module === 'orders' ? Ord.clearMulti() : deselect(); }
  if (mod && k === 'o') { e.preventDefault(); return openFolder(); }
  if (mod && k === 'n') { e.preventDefault(); return openCollDialog(); }
  if (mod && e.altKey && e.code === 'KeyB') { e.preventDefault(); return saveQuickAs(); }
  if (mod && /^[1-6]$/.test(e.key)) { e.preventDefault(); return setModule(MODULES[+e.key - 1][0]); }
  if (mod || (e.altKey && S.module !== 'retouch')) return;
  if (e.key === '?') return toggleHelp();
  if (!$('#help').hidden) { if (e.key === 'Escape') toggleHelp(false); return; }
  if (e.key === 'Tab') { e.preventDefault(); return e.shiftKey ? toggleAllPanels() : toggleSidePanels(); }
  if (S.module !== 'library') { const mm = Mods.get(S.module); if (mm && mm.key(e, k)) { e.preventDefault(); return; } }
  if (e.key === 'Escape') {
    if (S.fs) return exitFs();
    if (S.module !== 'library') return;
    if (S.lights) { S.lights = 0; return applyLights(); }
    if (S.mode !== 'grid') return setMode('grid');
    return;
  }
  if (k === 't' && e.shiftKey) { S.panels.toolbar = !S.panels.toolbar; savePrefs(); return renderAll(); }
  if (e.key === '\\') { S.panels.filterbar = !S.panels.filterbar; savePrefs(); return renderAll(); }
  if (!S.photos.length) return;
  const dg = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
  if (dg) { e.preventDefault(); const n = +dg[1]; return n <= 5 ? mark('rating', n, e.shiftKey) : mark('label', LABELS[n - 6], e.shiftKey); }
  switch (e.key) {
    case 'ArrowLeft': e.preventDefault(); return nav(-1, 0, e);
    case 'ArrowRight': e.preventDefault(); return nav(1, 0, e);
    case 'ArrowUp': e.preventDefault(); return S.mode === 'grid' && !S.fs ? nav(0, -1, e) : nav(-1, 0, e);
    case 'ArrowDown': e.preventDefault(); return S.mode === 'grid' && !S.fs ? nav(0, 1, e) : nav(1, 0, e);
    case ' ': e.preventDefault(); if (S.module !== 'library') setModule('library'); return setMode(S.mode === 'loupe' ? 'grid' : 'loupe');
  }
  if ('gecn'.includes(k) && k && S.module !== 'library') setModule('library');
  if (k === 'r' && S.module !== 'crop') return setModule('crop');
  if (k === 'q' && S.module !== 'retouch') return setModule('retouch');
  switch (k) {
    case 'g': if (S.fs) exitFs(); return setMode('grid');
    case 'e': if (S.fs) exitFs(); return setMode('loupe');
    case 'c': if (S.fs) exitFs(); return setMode('compare');
    case 'n': if (S.fs) exitFs(); return setMode('survey');
    case 'p': return mark('flag', 1, e.shiftKey);
    case 'x': return mark('flag', -1, e.shiftKey);
    case 'u': return mark('flag', 0, e.shiftKey);
    case 't': return markTeam(false);
    case 'b': return toggleQuickFor(targets());
    case 'l': return cycleLights();
    case 'f': return toggleFs();
    case 'z': return toggleZoom();
    case '=': case '+': return zoomBy(1.25);
    case '-': case '_': return zoomBy(1 / 1.25);
  }
}

    if (!plan || plan.error) return toast(this.inflight.has(p && p.path) ? 'Still checking this photo — try again in a moment' : 'This photo couldn’t be checked, so it can’t be adjusted');
    const r = plan.reference; if (!r) return toast('Nothing to adjust on this photo');
    this.A = plan.ref_aspect || 0.8; this.group = !!plan.landscape;
    this.adjusting = { center_x: r.center_x, top: r.top, height: Math.min(r.height, this.H, this.W / this.A) };
    this.render();
  },
  // arrow keys: 0.25% of the photo per press, 2.5% with Shift; + / − resize around the centre
  moveAdjust(dx, dy, big) {
    const a = this.adjusting; if (!a) return;
    const step = Math.max(1, this.H * (big ? 0.025 : 0.0025)), w = a.height * (this.A || 0.8);
    this.adjusting = { center_x: clamp(a.center_x + dx * step, w / 2, this.W - w / 2), top: clamp(a.top + dy * step, 0, this.H - a.height), height: a.height };
    this.layoutAdjust();
  },
  resizeAdjust(dir, big) {
    const a = this.adjusting; if (!a) return; const A = this.A || 0.8;
    const h = clamp(a.height * (1 + dir * (big ? 0.05 : 0.01)), 60, Math.min(this.H, this.W / A)), w = h * A;
    const cy = a.top + a.height / 2;
    this.adjusting = { center_x: clamp(a.center_x, w / 2, this.W - w / 2), top: clamp(cy - h / 2, 0, this.H - h), height: h };
    this.layoutAdjust();
  },
  cancelAdjust(quiet) { this.adjusting = null; this.target = 'full'; if (!quiet) this.render(); },
  async applyAdjust() {
    const p = this.active(); if (!p || !this.adjusting) return;
    const box = { center_x: Math.round(this.adjusting.center_x), top: Math.round(this.adjusting.top), height: Math.round(this.adjusting.height) };
    const prev = this.manual.get(p.path); const plan = this.plans.get(p.path);
    let m;
    if (this.target === 'square') {
      // the full-length sizes keep what they had: a hand placement, or the automatic framing
      const base = prev && !prev.kind ? prev : plan && plan.reference ? plan.reference : box;
      m = { center_x: Math.round(base.center_x), top: Math.round(base.top), height: Math.round(base.height), square: box };
    } else {
      m = { ...box };
      if (this.group) m.kind = 'group';
      else if (prev && prev.square) m.square = prev.square;
    }
    const wasSquare = this.target === 'square'; this.target = 'full';
    this.adjusting = null; this.manual.set(p.path, m); DB.put('manual', p.path, m).catch(() => {});
    this.plans.delete(p.path); this.render(); this.ensurePlan(p);
    toast(wasSquare ? `${prettySize(this.targetName)} placed by hand` : m.kind === 'group' ? 'Group framing placed by hand — both group sizes keep everything inside it' : 'Framing placed by hand — every full-length size is cut from it', 3500);
  },
  async resetManual() {
    const p = this.active(); if (!p || !this.manual.has(p.path)) return;
    this.manual.delete(p.path); DB.del('manual', p.path).catch(() => {});
    this.plans.delete(p.path); this.render(); this.ensurePlan(p); toast('Back to automatic framing');
  },
  layoutAdjust() {
    const a = this.adjusting; $('#cropAdj').hidden = !a; if (!a) return;
    const w = a.height * (this.A || 0.8), l = a.center_x - w / 2;
    const tag = $('#adjTag'); if (tag) tag.textContent = this.target === 'square' ? `${prettySize(this.targetName)} framing` : this.group ? 'Group framing — keep the whole team inside' : '8 × 10 framing';
    Object.assign($('#adjBox').style, { left: l / this.W * 100 + '%', top: a.top / this.H * 100 + '%', width: w / this.W * 100 + '%', height: a.height / this.H * 100 + '%' });
  },
  bindAdjust() {
    const box = $('#adjBox'); let drag = null;
    box.addEventListener('pointerdown', e => {
      if (!this.adjusting) return; e.preventDefault(); box.setPointerCapture(e.pointerId);
      drag = { h: e.target.dataset.h || 'move', x: e.clientX, y: e.clientY, a: { ...this.adjusting } };
    });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = (e.clientX - drag.x) / this.scale, dy = (e.clientY - drag.y) / this.scale, a0 = drag.a, A = this.A || 0.8;
      let { center_x, top, height } = a0; const w0 = height * A, l0 = center_x - w0 / 2;
      if (drag.h === 'move') { center_x = clamp(a0.center_x + dx, w0 / 2, this.W - w0 / 2); top = clamp(a0.top + dy, 0, this.H - height); }
      else {
        const right = l0 + w0, bottom = a0.top + a0.height;
        const sgnX = drag.h.includes('e') ? 1 : -1, sgnY = drag.h.includes('s') ? 1 : -1;
        let nh = Math.max(height + sgnY * dy, (height * A + sgnX * dx) / A);
        const anchorX = sgnX > 0 ? l0 : right, anchorY = sgnY > 0 ? a0.top : bottom;
        const maxW = sgnX > 0 ? this.W - anchorX : anchorX, maxH = sgnY > 0 ? this.H - anchorY : anchorY;
        nh = clamp(nh, 60, Math.min(maxH, maxW / A));
        const nw = nh * A;
        center_x = sgnX > 0 ? anchorX + nw / 2 : anchorX - nw / 2;
        top = sgnY > 0 ? anchorY : anchorY - nh; height = nh;
      }
      this.adjusting = { center_x, top, height }; this.layoutAdjust();
    });
    const up = () => { drag = null; };
    box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  },

  },

        <div class="btn-row"><button class="btn sm" data-crop="adjust">${plan.landscape ? 'Adjust group framing' : 'Adjust framing'} <kbd>A</kbd></button>${!plan.landscape && this.tightSize() && plan.status !== 'review' ? `<button class="btn sm" data-crop="square">Place ${prettySize(this.tightSize().name)} <kbd>S</kbd></button>` : ''}${plan.landscape && plan.status !== 'manual' ? '<span class="muted small">Group shot</span>' : ''}

    } else if (p) status = '<div class="status-card none checking"><div class="sc-head"><span class="spin-dot"></span><b>Checking framing…</b></div></div>';
    if (p && plan) this._lastCard = { path: p.path, html: status };
    const sizeRow = z => {

        <span class="swatch-line" style="--c:${this.color(z.name)}"></span>

        <span class="sz-dim">${d ? `${d[2]} × ${d[3]}` : on ? (plan && plan.missing && plan.missing.includes(z.name) ? '<span class="warn">not made</span>' : '—') : 'off'}</span></div>
        ${this.squareInches(z.name) > this.CIRCLE_IN ? `<div class="size-sub" title="Dim everything outside a ${this.CIRCLE_IN}″ circle centred in the ${prettySize(z.name)}, to check a round print"><span class="sub-elbow"></span><span class="sub-lbl">${this.CIRCLE_IN}″ circle mask</span><button class="mini-switch ${this.circle ? 'on' : ''}" data-circle="${esc(z.name)}" aria-label="${this.CIRCLE_IN} inch circle mask"></button></div>` : ''}`;
    };
    const portrait = this.sizes.filter(z => z.kind === 'portrait'), land = this.sizes.filter(z => z.kind === 'landscape');
    const nOn = this.sizes.filter(z => !off.has(z.name)).length, allOn = nOn === this.sizes.length;
    const master = `<div class="size-row master"><button class="chk ${allOn ? 'on' : nOn ? 'some' : ''}" data-sizeall="${allOn ? 'off' : 'on'}" title="${allOn ? 'Turn every size off' : 'Turn every size on'}"></button><span class="sz-name">All sizes</span><span class="sz-dim">${nOn} of ${this.sizes.length} on</span></div>`;

      ;
