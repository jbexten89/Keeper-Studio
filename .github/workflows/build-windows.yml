name: Build Windows app

# Builds a stand-alone "Keeper Studio" folder (Keeper Studio.exe + its files)
# so the app runs on a Windows PC with no Python installed. PyInstaller cannot
# cross-compile, so this runs on a Windows machine at GitHub.
#
# Every push to a branch makes a test build (kept 30 days under Actions).
# Publishing a Release on GitHub (Releases > Draft a new release, tag v1.2.0)
# builds that version and attaches the zipped app to the release, where it is
# kept until deleted.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  release:
    types: [published]

permissions:
  contents: write  # lets a tag build create its Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # mediapipe publishes no wheels for 3.13+.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller

      - name: Stamp the version from the tag
        if: github.event_name == 'release'
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart('v')
          (Get-Content keeperstudio/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content keeperstudio/__init__.py
          Get-Content keeperstudio/__init__.py | Write-Host
        shell: pwsh

      - name: Build
        run: pyinstaller --noconfirm keeperstudio.spec

      - name: Ship config, models and colour presets beside the exe
        run: |
          $dst = "dist/Keeper Studio"
          Copy-Item config.yaml "$dst/config.yaml" -Force
          Copy-Item luts "$dst/luts" -Recurse -Force
          Copy-Item models "$dst/models" -Recurse -Force
          Copy-Item LICENSE-PhotoCropper "$dst/LICENSE-PhotoCropper" -Force
        shell: pwsh

      - name: Smoke test the packaged exe
        # Runs the real binary and makes it load its config, find its models,
        # run a face detection and find its interface. A clean PyInstaller exit
        # only proves a file was written, not that the app works.
        run: |
          $exe = "dist/Keeper Studio/Keeper Studio.exe"
          if (-not (Test-Path $exe)) { throw "exe was not produced" }
          $result = "dist/Keeper Studio/selftest-result.txt"
          Remove-Item $result -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $result) { Get-Content $result | Write-Host } else { Write-Host "no self-test report was written" }
          if ($proc.ExitCode -ne 0) { throw "packaged app failed its self test (exit $($proc.ExitCode))" }
          Remove-Item $result -ErrorAction SilentlyContinue
          Write-Host "Packaged app runs." -ForegroundColor Green
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: KeeperStudio-Windows
          path: dist/Keeper Studio/
          retention-days: 30

      - name: Attach the app to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $zip = "KeeperStudio-Windows-$tag.zip"
          Compress-Archive -Path "dist/Keeper Studio" -DestinationPath $zip
          gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
        shell: pwsh
